    "einops",
    "flashinfer-python>=0.6.14",
    "huggingface-hub",
    "mooncake-transfer-engine>=0.3.13.post1",
    "Pillow>=12.3.0",
    "regex",
    "qwen-omni-utils",
    # qwen-omni-utils imports audioread for a video's audio track but does not
