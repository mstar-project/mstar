[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is "mstar-ai". The bare "mstar" is taken on PyPI and its
# similarity rule (separators are dropped before names are compared) also
# refuses "m-star" while that project exists. The import package is still
# `mstar` and the console scripts are unchanged, so `pip install mstar-ai`
# then `import mstar` works as expected.
name = "mstar-ai"
version = "0.2.1"
description = "Multimodal inference engine"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [{name = "mstar-project"}]
keywords = ["inference", "multimodal", "llm", "serving", "engine"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "fastapi",
    # floors for the HTTP stack: the first releases with the published
    # parser and form-limit fixes
    "starlette>=1.3.1",
    "h11>=0.16.0",
    "numpy",
    "PyYAML",
    "pyzmq",
    "msgpack",
    "python-multipart>=0.0.31",
    "requests",
    "torch>=2.10.0,<2.13.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "uvicorn",
    # uvicorn serves WebSockets (/v1/realtime) only with a ws library installed
    "websockets",
    "gdown",
    # Floor only: every release from 2.14.5 caps fsspec, so once a newer fsspec
    # is picked, an unbounded datasets backtracks to 1.2.1, whose tqdm<4.50 pulls
    # transformers back to 5.10, which then fails to import GenerationMixin.
    # 3.0 also needs tqdm>=4.66.3.
    "datasets>=3",
]

[project.urls]
Homepage = "https://github.com/mstar-project/mstar"
Repository = "https://github.com/mstar-project/mstar"
Issues = "https://github.com/mstar-project/mstar/issues"

[project.scripts]
mstar = "mstar.cli.main:main"
mstar-serve = "mstar.api_server.entrypoint:main"

[project.optional-dependencies]
# OmniVoice reuses the reference package for weight loading, the rule-based
# duration estimator, language/instruct validation and the pydub silence
# trim; mstar owns the graph.
#
# Deliberately not pinned here: the PyPI release has no
# `omnivoice.models.omnivoice_flashinfer`, which is the forward this graph
# calls, so it has to come from git. A direct URL in requires_dist would make
# PyPI reject the mstar upload, so it is an install step instead — see
# docs/installation.rst, same as flash-attn.
omnivoice = []
command_a_plus = [
    "flashinfer-python>=0.6.18",
    "huggingface-hub>=1.5",
    "mooncake-transfer-engine>=0.3.13.post1",
    "ninja",
    "safetensors",
    "transformers>=5.17",
]

dev = [
    "ruff<=0.16",
    "pytest>=9.0.3",
]

# Optional: non-WAV audio containers (mp3/flac/...) for the OpenAI audio API
# and SDK. WAV/PCM work without this.
audio = [
    "soundfile",
]

# Optional: Prometheus metrics at /metrics (``mstar serve --enable-metrics``).
metrics = [
    "prometheus-client>=0.20",
]

# Optional: the eval framework (`python -m benchmark.eval`, docs/evaluation.rst).
# The runner, metrics and reports need only aiohttp and numpy; the judges
# (Whisper, WavLM speaker similarity, UTMOS via torch.hub), the dataset
# builders, compare's media inputs and PSNR checks (PyAV, Pillow) and the
# charts import the rest lazily. Install it in a separate client environment
# if the server's should stay lean.
eval = [
    "aiohttp",
    "av",
    "datasets",
    "huggingface-hub",
    "matplotlib",
    "Pillow>=12.3.0",
    "soundfile",
    "transformers",
]

# Optional: the opt-in AudioSeal watermark on generated speech
# (``audio_watermark`` in a deployment's model_kwargs; MIT code and weights).
# 0.3 may change the streaming layers mstar.model.audio_watermark drives.
audioseal = [
    "audioseal>=0.2,<0.3",
]

# Optional: server_vad turn detection on /v1/realtime. Silero VAD (MIT) ships
# its 2 MB ONNX weights in the wheel; onnxruntime (MIT) runs them on one thread.
# semantic_vad also runs Pipecat's Smart Turn v3 (BSD-2 weights, fetched
# separately) with onnxruntime on Whisper features from transformers (Apache-2.0).
vad = [
    "silero-vad>=5.1",
    "onnxruntime>=1.17",
    "transformers",
]

# Optional: serve a deployment as a NVIDIA Dynamo backend
# (python -m mstar.integrations.dynamo). Nothing outside
# mstar/integrations/dynamo/ imports these.
dynamo = [
    "ai-dynamo>=1.4.0,<1.5",
    "uvloop",
]

bagel = [
    "einops",
    "flashinfer-python>=0.6.14",
    "huggingface-hub",
    "mooncake-transfer-engine>=0.3.13.post1",
    "Pillow>=12.3.0",
    "regex",
    "safetensors",
    "torchvision",
    "torchaudio",
    "torchcodec",
    "transformers",
]

bagel_xpu = [
    "einops",
    "huggingface-hub",
    "mooncake-transfer-engine>=0.3.13.post1",
    "Pillow>=12.3.0",
    "regex",
    "safetensors",
    "torchvision",
    "torchaudio",
    "torchcodec",
    "transformers",
    "vllm-xpu-kernels==0.1.15.4",
]

cosmos3 = [
    # PyAV backs torchvision's write_video, the video-container fallback used
    # when torchcodec is too old to ship VideoEncoder (< 0.9).
    "av",
    # The Cosmos3 reference pipeline (used by the parity tests) landed in
    # diffusers 0.39; serving itself uses AutoencoderKLWan and the scheduler.
    "diffusers>=0.39",
    # bs=1 dense attention fast path. The wheel is ABI-tied to the torch/CUDA
