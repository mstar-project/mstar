# qwen-tts is an install step with --no-deps, not a dependency: mstar loads only
# its 12 Hz speech-tokenizer modules (under transformers 4.57.3 or 5.x), but its
# metadata pins transformers==4.57.3 and accelerate==1.12.0. No environment that
# also has diffusers>=0.40 or OmniVoice can satisfy that pin, and installing it
# into one downgrades huggingface-hub under them. See docs/installation.rst.
qwen3_tts = [
    "einops",
    "flashinfer-python>=0.6.14",
    "huggingface-hub",
    "mooncake-transfer-engine>=0.3.13.post1",
    "safetensors",
    "soundfile",  # reference-audio decoding for Base voice cloning
    "transformers>=4.57.3",
]

fish_s2_pro = [
    "flashinfer-python>=0.6.14",
    "huggingface-hub",
    "mooncake-transfer-engine>=0.3.13.post1",
    "safetensors",
    "soundfile",  # reference-audio decoding for voice cloning
    "transformers",
]

kokoro = [
    # misaki is the G2P (lexicon + spaCy tagger); `misaki[en]` additionally
