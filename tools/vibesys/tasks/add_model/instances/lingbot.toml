# add-model instance: lingbot-video-dense-1.3b (text-to-video DiT port into mstar).
#
# Architecture (from HF model_index.json / transformer config):
#   LingBotVideoPipeline = Qwen3VLForConditionalGeneration text encoder
#     -> LingBotVideoTransformer3DModel (flow DiT, depth 24, hidden 2048, 16ch)
#     -> AutoencoderKLWan VAE, FlowUniPCMultistepScheduler
# Official code: https://github.com/Robbyant/lingbot-video (pip install -e .)
#
# Only the final mp4 is observable over /v1/videos/generations, so the gate is a
# single generative walk (fixed seed/steps/res video similarity), not multi-walk.

[model]
name = "lingbot"
hf_id = "robbyant/lingbot-video-dense-1.3b"
revision = ""
extra = "all"                        # mstar extra baked into the eval image (docker path)
reference_model = "wan22"            # closest mstar model: Wan2.2 video DiT + Wan VAE + UniPC
served_model_name = "lingbot"
endpoint = "/v1/videos/generations"
port = 8000
modality = "video_generation"        # vibesys --modality
accuracy_mode = "smoke"              # smoke first (valid mp4); flip to "strict" once a reference is captured

[headline]
metric = "latency_p50_ms"
walk = "t2v_generate"
result_arg = "--output-json"

# Single observable walk: text-to-video generation. compare=ssim for the strict
# path (fixed seed/steps/res). tol is generous: cross-impl diffusion drift is real.
[[walk]]
name = "t2v_generate"
kind = "generative"
compare = "ssim"
tol = 0.25

[official_source]
repo = "https://github.com/Robbyant/lingbot-video"
subdir = ""
revision = ""
