model: "muse_glimmer"
max_seq_len: 32768

resources:
  kv_cache:
    # One KV head a rank: 26 KiB a token, 4.9 MiB a page of 192, 6.5 GiB a rank. The
    # same pages as muse_glimmer.yaml, so the same 71 requests of 8K tokens or 24
    # of 32K (31 or 7 keeping every layer's K/V; benchmark/kv_capacity.py).
    # max_num_pages counts pages of page_size, as in muse_glimmer.yaml.
    page_size: 192
    max_num_pages: 1365

node_groups:
  # Two KV heads, so TP past 2 replicates the KV cache and saves no memory.
  - node_names: [vision_encoder]
    ranks: [0]
  - node_names: [LLM]
    ranks: [0, 1]
    tp_size: 2

# Decode all-reduces on the compute stream through NVLS multicast, where NCCL's
# ring all-reduces took 1.1-2.1 ms a step: +15% text throughput at c=32 (2x H200,
# MSTAR_TP_ASYNC_SCHED=1 MSTAR_SHM_ARENA=1, 2026-10-24). Falls back to NCCL, with a
# warning, where multicast isn't available.
tp_allreduce: symm_multimem
# 13 KiB a token (6656 bf16): the default 512 KiB sent every step past 39 tokens
# to NCCL. 4096 covers the 128-row decode bucket and short prompt chunks: +14%
# text and +10% image throughput at c=64 (2x H200, 2026-10-28).
tp_allreduce_max_kb: 4096

warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
