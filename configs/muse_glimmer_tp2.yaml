model: "muse_glimmer"
max_seq_len: 32768

resources:
  kv_cache:
    # One KV head a rank: 26 KiB a token, 6.5 GiB a rank, the same pages as
    # muse_glimmer.yaml. Above one rank no pool allots, so a request holds only the
    # pages it keeps: these pages held 71 requests of 8K tokens or 24 of 32K that way
    # (31 or 7 keeping every layer's K/V), being re-measured at TP2 with
    # benchmark/kv_capacity.py.
    max_num_pages: 2048
    # a pool that keeps a window doesn't prefix cache yet
    prefix_cache: false

node_groups:
  # Two KV heads, so TP past 2 replicates the KV cache and saves no memory.
  - node_names: [vision_encoder]
    ranks: [0]
  - node_names: [LLM]
    ranks: [0, 1]
    tp_size: 2

warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
