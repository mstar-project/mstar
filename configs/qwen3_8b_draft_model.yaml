model: "qwen3_8b"
# Qwen3-8B with Qwen3-0.6B as a separate draft model: the 0.6B drafts 3 tokens a decode step in
# one-row passes (its own 28 layers and 16 query heads, one token behind the target), and the target
# verifies them in the same forward. Greedy replies are the target's; temperature > 0 verifies by
# speculative sampling. A request's repetition_penalty (other than 1) is refused. Off: drop `draft`.
# Docs: docs/serving.rst (the `draft` block), docs/models.rst (Qwen3).
# required by the serving config; a verifying deployment is refused at startup if its KV pool holds a
# request to less than this. The checkpoint's context bounds a request,
# and the KV pool holds two verify steps' worth more
max_seq_len: 40960
model_kwargs:
  draft:
    method: draft_model
    model: Qwen/Qwen3-0.6B
    # one-row passes stay under the target's verify step to k = 4 (0.60-0.85x on one H100,
    # benchmark/draft_model_cost/step_cost.py)
    num_draft_tokens: 3
    # asynchronous where every resource corrects itself on the device (FA3 on Hopper),
    # else synchronous; the startup log says which and why
    mode: auto
resources:
  kv_cache:
    # target and draft model KV in one pool: 36 + 28 layers x 8 KV heads x 128 dims x K and V x bf16
    # = 256 KiB a token
    max_num_pages: 1024
    # host pages to preempt into, ~8 GiB of pinned host memory: a verifying node never
    # drops a request, so with none every request is guaranteed and reserves its whole
    # footprint at admission
    cpu_offload_pages: 256
node_groups:
  - node_names: [LLM]
    ranks: [0]
