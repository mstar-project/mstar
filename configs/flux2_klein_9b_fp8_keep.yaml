model: "flux2_klein_9b"

# fp8 with fp8_keep_bf16 on every step, on every platform: flux2_klein_9b.yaml explains the settings, the license and why this is not
# its AMD default. MI325X, shared node: 1.753 / 1.701 / 1.776 / 1.813 images/s at c=1/4/8/16 with the solo text encoder, median
# 26.48 dB from diffusers at c=1, 25.72 at c=16 (floor 25.46).
max_seq_len: 512

model_kwargs: &model_kwargs
  linear_dtype: fp8
  attention_backend: auto
  compile: true
  compile_eager_rounding: true
  compile_exact_ops: [norms]
  accelerator_graph: true
  capture_sizes: [[1024, 1024], [768, 1344]]
  capture_edit_sizes: [[1024, 1024]]
  capture_batch_sizes: [1, 2, 3, 4]
  max_batch_size: 4
  vae_compile: true
  fp8_keep_bf16:
    - double_blocks.*.attn.*
    - double_blocks.*.img_ff.*
    - single_blocks.0-13.out
    - single_blocks.15-16.out
    - single_blocks.18.out
    - single_blocks.0.qkv_mlp
    - single_blocks.3.qkv_mlp

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]

knobs:
  dit_exact_ops: true

platform_overrides:
  rocm:
    model_kwargs:
      <<: *model_kwargs
      text_encoder_max_batch_size: 1
