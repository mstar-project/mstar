# Tiny fp32 Kimi K3 on two GPUs (TP2) with decoding requests riding along in prefill steps
# (model_kwargs.mixed_prefill_decode): the served greedy output must still match the dense
# reference, and a closed loop with overlapping prompts must complete every request.
model: "kimi_k3"
max_seq_len: 4096
model_kwargs:
  checkpoint_dir: /scratch/m000137-pm06/atj10/kimi_k3_mstar/ref/tiny_kimi_k3
  max_output_tokens: 256
  mixed_prefill_decode: true
node_groups:
  - node_names: [LLM]
    ranks: [0, 1]
    tp_size: 2
    graph_walks: [prefill, decode]
resources:
  mla_kv:
    max_num_pages: 512
    page_size: 64
  kda_state:
    max_slots: 129
