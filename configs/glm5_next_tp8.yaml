model: "glm5_next"
# GLM-5.3-Flash on 8 GPUs of 80 GB. The fp8 checkpoint is 306 GB, so weights
# are ~38 GB/rank at TP8; the KV and KDA budgets below leave headroom for
# activations, graphs and NCCL. Resolve the checkpoint through the HF cache
# (HF_HOME) or pass model_kwargs.checkpoint_path.
max_seq_len: 2048
model_kwargs:
  # "auto" takes the fused fp8 MoE kernel when one is available, which is
  # what lets decode capture; "reference" is an eager, uncapturable fallback.
  moe_quant_kernel: "auto"
  # MTP drafting is not implemented yet; > 0 is refused at construction.
  mtp_num_draft_tokens: 0
# Per-resource overrides, keyed by what get_node_resources declares.
resources:
  kv_cache:
    # Only the 11 MLA layers are paged, one 576-wide latent per token per
    # layer: ~12.7 KB/token/rank. 512 pages x 128 tokens = 32 full-length
    # requests, ~0.8 GB/rank. Sized to the slot pool below, which is the
    # real concurrency limit.
    max_num_pages: 512
    page_size: 128
  kda_state:
    # One slot per in-flight request, head-sharded across TP like the KDA
    # layers: ~18.5 MB/slot/rank, ~0.6 GB/rank here. This is also the decode
    # batch cap, since the captured buckets are bounded by it.
    max_slots: 32
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
