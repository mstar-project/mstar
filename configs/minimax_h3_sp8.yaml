model: "minimax_h3"

# See minimax_h3.yaml.
max_seq_len: 8192

# MiniMax-H3 on 8 GPUs: the DiT sequence-parallel over all eight (56 heads, 7 per rank
# after the exchange), compiled; the conditioner on rank 0, the keyframe encoder, the
# audio decoder and the video combine on rank 1, the video decode split over ranks 0-3
# as in minimax_h3.yaml. Not run yet: no server has started from this file.
model_kwargs:
  attention_backend: flashinfer
  compile: true
  vae_tile_batch: 28
  vae_parallel: 4

node_groups:
  - node_names: [dit]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    sp_size: 8
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, audio_decoder, video_combine]
    ranks: [1]
  - node_names: [vae_decoder_0]
    ranks: [0]
  - node_names: [vae_decoder_1]
    ranks: [1]
  - node_names: [vae_decoder_2]
    ranks: [2]
  - node_names: [vae_decoder_3]
    ranks: [3]
