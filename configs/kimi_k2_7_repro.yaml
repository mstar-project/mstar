model: "kimi_k2_7"
# Kimi-K2.7 text backbone — REDUCED / synthetic single-GPU repro config (Phase 2
# gap-4 serve bring-up). It drives the full serving path (API server -> conductor
# -> worker -> KV_CACHE engine -> decode loop -> tokens) on a tiny model that runs
# without the 1T checkpoint. NOT a real deployment — for that use kimi_k2_7.yaml.
#
# `model_kwargs` (forwarded to KimiK2Model.__init__) redirect this model at a
# local synthetic checkpoint + reduced config + a trivial byte tokenizer, so no
# 1T weights and no real Kimi tokenizer are needed:
#   * config_variant: reduced   -> KimiK2Config.reduced() (vocab 256, 2 layers)
#   * checkpoint_path            -> the dir written by
#                                   tools/kimi_goldens/make_repro_checkpoint.py
#   * tokenizer_mode: byte       -> UTF-8 byte identity tokenizer (ids in [0,256))
#
# Generate the checkpoint first (writes tools/kimi_goldens/repro/checkpoint, which
# is gitignored):
#   python tools/kimi_goldens/make_repro_checkpoint.py
# `checkpoint_path` is relative to the mstar package root — run `mstar-serve` from
# there (the launch harness does). Make it absolute if you launch from elsewhere.
max_seq_len: 512
model_kwargs:
  config_variant: reduced
  checkpoint_path: tools/kimi_goldens/repro/checkpoint
  tokenizer_mode: byte
# Small paged KV cache — the reduced model needs almost nothing (2 layers, 4 heads,
# head_dim 64). 256 pages * 128 = 32768-token capacity, ~33 MB. Sized to cover
# CUDA-graph decode capture (default batch sizes up to 64, double-buffered), not
# just the single serving request.
kv_cache:
  max_num_pages: 256
  page_size: 128
# The CUDA-graph prefill capture grid is trimmed to a single short-prompt bucket
# at batch size 1 by KimiK2Config.reduced() (its prefill_token_buckets /
# prefill_capture_batch_sizes), which `config_variant: reduced` above selects — so
# no env vars are needed. The full 6x5 grid is only captured for the full model.
node_groups:
  - node_names: [LLM]
    ranks: [0]
    tp_size: 1
    graph_walks: [prefill, decode]
