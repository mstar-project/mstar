model: "qwen3_omni"
max_seq_len: 32768
# The KV pools default to 2,048 pages. The Thinker's is 24 GiB at 12 MiB a page,
# and every node's weights on one 80 GB GPU leave about 12 GiB. At 256 Thinker
# pages the encoder and Thinker graphs no longer fit beside them; 176 leaves
# room for the Talker's graphs, 15 of the Thinker's 74 and some of the encoders'
# (at 80 GB). One request can use at most about 22K tokens of prompt and output,
# the whole pool, which all requests share: a request that can't fit gets a 400,
# and one with no output limit has its output cut to fit.
resources:
  thinker_kv:
    max_num_pages: 176
  talker_kv:
    max_num_pages: 256
node_groups:
  - node_names: [audio_encoder, vision_encoder, Code2Wav]
    ranks: [0]

  - node_names: [Thinker, Talker]
    ranks: [0]