model: "qwen3_omni"
max_seq_len: 32768
# One worker on every platform: qwen3omni_colocated.yaml without its AMD override.
resources:
  thinker_kv:
    max_num_pages: 256
  talker_kv:
    max_num_pages: 256
node_groups:
  - node_names: [audio_encoder, vision_encoder, Code2Wav]
    ranks: [0]

  - node_names: [Thinker, Talker]
    ranks: [0]
