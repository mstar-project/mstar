model: "wan22"

# FastVideo's FastWan2.2-TI2V-5B: Wan2.2-TI2V-5B DMD-distilled to 3 unguided steps
# (timesteps 1000, 757, 522), the same DiT as configs/wan22.yaml with the DMD
# sampler in place of 50 UniPC steps x CFG. Requests may leave out
# num_inference_steps and guidance_scale; any other step count, guidance above 1
# or an image input is a 400. Distilled output is not the base model's: compare it
# against FastVideo's own pipeline.
max_seq_len: 512

model_kwargs:
  model_path_hf: FastVideo/FastWan2.2-TI2V-5B-FullAttn-Diffusers
  sampler: dmd
  vae_decode_fast_sizes: ["1280x704", "832x480"]
#   dmd_timesteps: [1000, 757, 522]

node_groups:
  - node_names:
      - text_encoder
    ranks:
      - 0

  - node_names:
      - vae_encoder
      - vae_decoder
    ranks:
      - 0

  - node_names:
      - dit
    ranks:
      - 0
