model: "kimi_k2_7"
# TP8 Kimi-K2.7-Code config using a RAM-backed /dev/shm checkpoint copy.
max_seq_len: 262144
# Loading ~600GB of INT4 experts across 8 ranks
# MSTAR_DIST_TIMEOUT_S overrides this.
dist_timeout_s: 7200
# Copy the checkpoint into /dev/shm first, then point at it at launch:
#   mstar serve kimi_k2_7 --model-path /dev/shm/kimi_k2_7_code
#   mstar-serve --config configs/kimi_k2_7_code_tp8_shm.yaml \
#               --model-path /dev/shm/kimi_k2_7_code
model_kwargs:
  config_variant: k27_code
  tokenizer_mode: hf
resources:
  kv_cache:
    # Absorbed MLA caches one 576-wide bf16 latent per token (kv_lora_rank 512 +
    # qk_rope_head_dim 64) over 61 layers: 9.0 MB per 128-token page, replicated
    # on every TP rank. 3072 pages = 27.6 GB per rank = 393k tokens: one 262k
    # request plus headroom. Needs more than 80 GB per rank: on 8x H100 the full
    # checkpoint does not fit at TP8, and the 192-expert pruned checkpoint serves
    # with 1536 pages (59 GB per rank after load).
    max_num_pages: 3072
    page_size: 128
node_groups:
  - node_names: [vision_encoder]
    ranks: [0]

  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, prefill_vision, decode]
