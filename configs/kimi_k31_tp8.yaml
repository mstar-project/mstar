model: "kimi_k31"
# Kimi K3.1 Pro on 8x B300 (288 GB), tensor parallel: 12 KDA and 12 MLA heads per rank, the
# routed experts sharded by intermediate dim (3072 / 8 = 384). With the release's MXFP4 experts
# held as stored (the quantization API's mxfp4 experts format, `quantization: auto`) a rank
# holds ~195 GB of weights: ~180 GB of experts, ~15 GB bf16. bf16 experts do not fit any
# 8-GPU node (5.4 TB). Resolve the checkpoint through the HF cache or model_kwargs.checkpoint_path.
#
# Within index_topk (2048) tokens dense MLA is exactly K3.1's DSA, so this config serves
# 2048-token contexts on the dense paged path; kimi_k31_tp8_longctx.yaml goes past it.
max_seq_len: 2048
# One request per KDA slot below.
max_concurrent_requests: 64
tp_allreduce: "flashinfer"
tp_allreduce_max_kb: 32768
tp_async_sched: true
model_kwargs:
  max_seq_len: 2048
  kda_max_requests: 64
  # routed experts: auto = FlashInfer's trtllm-gen MXFP4 x MXFP8 MoE with SiTU fused on B200/B300 (vLLM's
  # FLASHINFER_TRTLLM_MXFP4_MXFP8) where its load probe agrees, else Marlin; trtllm / marlin force one. Its
  # tactics are tuned at load (routed_experts_autotune, default true; routed_experts_tune_tokens, default
  # every FlashInfer bucket: 1..256, 512..8192) and kept per GPU under ~/.cache/mstar/flashinfer_moe_tune: the first boot pays for it
  routed_experts_backend: auto
  # prefill captured at these packed token counts, 1-8 rows (prefill_capture_batch_sizes): an eager prefill
  # step costs ~2.2 ms of host work a layer whatever its length (216-221 ms for a 960-token prompt on B300,
  # nearly all of c=1's TTFT, and every decode row waits it out under load); a replay costs its kernels.
  # A step past 8192 tokens or 8 rows, or a chunk cut off a 64-key boundary, runs eager.
  prefill_token_buckets: [512, 1024, 2048, 3072, 4096, 6144, 8192]
resources:
  kv_cache:
    # 24 MLA layers x 576-wide latent, bf16, replicated: ~27.6 KB/token/rank. 64 requests of
    # 2048 tokens at 128 tokens a page plus the sink: ~3.6 GB/rank.
    max_num_pages: 1025
    page_size: 128
  kda_state:
    # 64 requests plus the sink, head-sharded like the KDA layers: 69 layers x 12 heads x
    # 128 x 128 fp32 + the conv tails, ~56 MB/slot/rank, ~3.7 GB/rank.
    max_slots: 65
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
