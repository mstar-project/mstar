model: "glm52"
# GLM-5.2 TP8 on coriander (8xH200), pinned to the shared-cache snapshot so
# offline resolution can't miss (cache entry is models--zai-org--GLM-5.2-FP8).
# Same box-path precedent as kimi_k2_7_code_tp8.yaml. See glm52_tp8.yaml for
# the generic variant and the Phase B ctx<=2048 rationale.
max_seq_len: 2048
dist_timeout_s: 7200
model_kwargs:
  checkpoint_path: /m-coriander/coriander/hf/hub/models--zai-org--GLM-5.2-FP8/snapshots/ba978f7d347eaf65d22f1a86833408afdb953541
  tokenizer_mode: hf
kv_cache:
  max_num_pages: 512
  page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
