model: "qwen3_8b"
# Qwen3-8B with EAGLE-3 (RedHatAI/Qwen3-8B-speculator.eagle3: one decoder layer reading the streams
# entering target layers 2, 18 and 33, drafting over a 32,000-token vocabulary mapped back to the
# target's). Each decode step chains 3 drafts, its trained depth, and the target verifies them in the
# same forward. Greedy replies are the target's; temperature > 0 verifies by speculative sampling. A
# request's repetition_penalty (other than 1) is refused. Off: drop `draft`. Docs: docs/serving.rst
# (the `draft` block), docs/models.rst (Qwen3).
# required by the serving config, read by nothing; the checkpoint's context bounds a request,
# and the KV pool holds two verify steps' worth more
max_seq_len: 40960
model_kwargs:
  draft:
    method: eagle3
    model: RedHatAI/Qwen3-8B-speculator.eagle3
    num_draft_tokens: 3
    # asynchronous where every resource corrects itself on the device (FA3 on Hopper),
    # else synchronous; the startup log says which and why
    mode: auto
resources:
  kv_cache:
    # target and drafter KV in one pool: 36 + 1 layers x 8 KV heads x 128 dims x K and V x bf16
    # = 148 KiB a token
    max_num_pages: 1024
node_groups:
  - node_names: [LLM]
    ranks: [0]
