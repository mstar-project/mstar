model: "qwen3_8b"
# Qwen3-8B with EAGLE-3 (RedHatAI/Qwen3-8B-speculator.eagle3: one decoder layer reading the streams
# entering target layers 2, 18 and 33, drafting over a 32,000-token vocabulary mapped back to the
# target's). Each decode step chains 3 drafts, its trained depth, and the target verifies them in the
# same forward. Greedy replies are the target's; temperature > 0 verifies by speculative sampling. A
# request's repetition_penalty (other than 1) is refused. Off: drop `draft`. Docs: docs/serving.rst
# (the `draft` block), docs/models.rst (Qwen3).
# The longest request served, in tokens: the checkpoint's context. The KV pool adds two verify
# steps of slack past it, and startup refuses a verifying deployment whose pool can't hold both.
max_seq_len: 40960
model_kwargs:
  draft:
    method: eagle3
    model: RedHatAI/Qwen3-8B-speculator.eagle3
    num_draft_tokens: 3
    # asynchronous where every resource corrects itself on the device (FA3 on Hopper),
    # else synchronous; the startup log says which and why
    mode: auto
resources:
  kv_cache:
    # target and drafter KV in one pool: 36 + 1 layers x 8 KV heads x 128 dims x K and V x bf16
    # = 148 KiB a token
    # 32-token pages, a trade-off against main's default of 128: an arrival that hits the prefix
    # cache recomputes at most 31 tokens past its last full page instead of 127, so a mixed step's
    # prompt rows fit its +32 rung, and FA3's paged kernel never reads past a row's length
    # (FA3_TAIL_SAFE_PAGE_SIZE). Same token capacity as 1024 pages of 128.
    page_size: 32
    max_num_pages: 4096
    # host pages to preempt into, ~9.3 GiB of pinned host memory: a verifying node never
    # drops a request, so with none every request is guaranteed and reserves its whole
    # footprint at admission
    cpu_offload_pages: 2048
node_groups:
  - node_names: [LLM]
    ranks: [0]
