model: "qwen3_omni"
max_seq_len: 32768
# The Thinker's KV pool at its default 2,048 pages, 24 GiB at 12 MiB a page. It fits
# beside the weights on an H200; qwen3omni_2gpu.yaml sizes it for an 80 GB GPU.
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
