# qwen3omni_2gpu_split.yaml with first audio after 4 codec frames, then 8 and
# 16 on the way to 25-frame chunks. Every window still pads to the default's 50
# frames, so the vocoder needs no new capture.
model: "qwen3_omni"
max_seq_len: 32768
model_kwargs:
  codec_chunk_schedule: [4, 8, 16]
resources:
  thinker_kv:
    max_num_pages: 1024
    cpu_offload_pages: 1024
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  - node_names: [Talker]
    ranks: [0]
  - node_names: [Code2Wav]
    ranks: [2]
rank_devices: {2: 0}
