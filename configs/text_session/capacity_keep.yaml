# A full deployment refuses a new session rather than making room, so a client
# at the cap is told to end one first.
model: "test_text_session"
max_seq_len: 32768
max_concurrent_requests: 8

sessions:
  # small on purpose: two sessions is enough to reach the cap in a test
  max_concurrent_sessions: 2
  capacity_policy: keep
  default_timeout_s: 600.0
  max_timeout_s: 1800.0
  ttl_mode: idle
  resources:
    kv:
      # pages (128 tokens each), so ~8k tokens of conversation per session
      max_state: 64

node_groups:
  - node_names:
      - LLM
    ranks:
      - 0
