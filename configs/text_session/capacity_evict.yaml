# A full deployment evicts its least recently used idle session to make room.
# A session with a request in flight is never the victim.
model: "test_text_session"
max_seq_len: 32768
max_concurrent_requests: 8

sessions:
  # small on purpose: two sessions is enough to reach the cap in a test
  max_concurrent_sessions: 2
  capacity_policy: evict
  default_timeout_s: 600.0
  max_timeout_s: 1800.0
  ttl_mode: idle
  resources:
    kv:
      # pages (128 tokens each), so ~8k tokens of conversation per session
      max_state: 64

node_groups:
  - node_names:
      - LLM
    ranks:
      - 0
