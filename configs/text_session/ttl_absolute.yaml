# A short absolute TTL: the session is collected 30s after it was started,
# however busy it has been. Traffic does not keep it alive.
model: "test_text_session"
max_seq_len: 32768
max_concurrent_requests: 8

sessions:
  max_concurrent_sessions: 4
  capacity_policy: keep
  default_timeout_s: 30.0
  # low enough that a client asking for the usual 300s is a 400
  max_timeout_s: 60.0
  ttl_mode: absolute
  resources:
    kv:
      max_state: 64
      overflow_policy: clear

node_groups:
  - node_names:
      - LLM
    ranks:
      - 0
