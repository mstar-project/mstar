model: "kimi_k31"
# kimi_k31_tp8.yaml past index_topk with K3.1's DSA: the MLA layers' indexers hand their keys
# and queries to the DSA resource, and every token past the 2048th, prompt or decode, attends its
# own top-2048 latents. Prompts prefill in chunks of prefill_chunk_tokens. Decode runs eager (the
# resource selects per request on the host). Its per-request index keys (24 layers x 128,
# ~6 KB/token/rank) live outside the paged pool.
max_seq_len: 131072
dist_timeout_s: 7200
# 16 full-window requests fit the pool below.
max_concurrent_requests: 16
tp_allreduce: "flashinfer"
tp_async_sched: true
model_kwargs:
  dsa_long_context: true
  max_seq_len: 131072
  kda_max_requests: 16
  # tokens a prefill step runs: a 128K prompt is 16 chunks
  prefill_chunk_tokens: 8192
resources:
  kv_cache:
    # 16 x 1024 pages of 128 tokens + the sink, ~27.6 KB/token/rank: ~58 GB/rank.
    max_num_pages: 16385
    page_size: 128
  kda_state:
    max_slots: 17
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
