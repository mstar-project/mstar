model: "flux2_klein_9b"

# On AMD GPUs flux2_klein_9b.yaml serves this schedule with the solo text encoder, this file keeps the encoder batched
max_seq_len: 512

model_kwargs: &model_kwargs
  linear_dtype: fp8
  # bbpf in the file name reads b = a bf16 step, p = a step with only some linears in fp8, f = an fp8 step. The partial
  # step is not implemented, so this file runs [bf16, bf16, fp8, fp8].
  linear_dtype_steps: [bf16, bf16, fp8, fp8]
  # the file's keep list on both fp8 steps, the list the one-GPU A/B put over the floor
  linear_keep_bf16: ['double_blocks.*.attn.*', 'double_blocks.*.img_ff.*', 'double_blocks.*.txt_ff.*', 'single_blocks.0-13.out', 'single_blocks.15-16.out', 'single_blocks.18.out', 'single_blocks.0.qkv_mlp', 'single_blocks.3.qkv_mlp']
  # torch's sdpa is the reference kernel on NVIDIA; on AMD GPUs auto runs AITER's asm flash attention
  attention_backend: sdpa
  compile: true
  compile_eager_rounding: true
  compile_exact_ops: [norms]
  accelerator_graph: true
  capture_sizes: [[1024, 1024], [768, 1344]]
  capture_edit_sizes: [[1024, 1024]]
  capture_batch_sizes: [1, 2, 3, 4]
  max_batch_size: 4
  vae_compile: true

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]

knobs:
  dit_exact_ops: true

platform_overrides:
  rocm:
    model_kwargs:
      <<: *model_kwargs
      attention_backend: auto
