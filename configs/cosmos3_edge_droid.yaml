model: "cosmos3_edge_droid"
# Sequence-length hint for the scheduler (see cosmos3_edge.yaml).
max_seq_len: 8192
# The policy checkpoint serves action requests (and the Edge video paths);
# the pool matches cosmos3_edge.yaml.
resources:
  kv:
    max_num_pages: 1024
model_kwargs:
  accelerator_graph: true
  graph_max_latent_area: 2000
  image_size_default: [640, 640]
  video_size_default: [832, 480]
  num_frames_video: 121
  num_inference_steps_video: 20
  guidance_scale: 6.0
  flow_shift_video: 12.0
  # Image-to-video conditioning follows the model card's diffusers recipe:
  # cover-scale, antialiased resize, center crop, 8-bit rounding.
  conditioning_resize: aspect_crop
  # The released Edge DROID policy serves a 4-step denoise at guidance 3.0;
  # its scheduler config carries the 480p training flow shift (5.0).
  num_inference_steps_action: 4
  guidance_scale_action: 3.0
  flow_shift_action: 5.0
  # The cosmos-framework cookbook serves it with guidance only on timesteps in
  # [960, 1001], which is the first of the four steps.
  guidance_interval_action: [960, 1001]
  # Policy requests default to the checkpoint's checkpoint.json (32 predicted
  # rows, 15 fps, droid_lerobot) and to the 736x544 bucket the 640x540 camera
  # composite pads into. The checkpoint keeps the gripper as 1 - gripper, so
  # robot_state takes the robot's gripper and the reply gives it back.
  policy_size: [736, 544]
  policy_flip_dims: [7]
node_groups:
  # No reasoner: the policy checkpoint ships no vision encoder, so the chat
  # walks are not built and the DiT runs alone.
  - node_names: ["dit"]
    ranks: [0]
  - node_names: ["vae_encoder", "vae_decoder"]
    ranks: [0]
# The first policy request of a fresh server compiles the action denoise step,
# guided and conditional-only (about 9 s); this warms both at startup with the
# model card's example frame as the observation and the policy defaults above.
warmup_requests:
  - text: warmup
    files: [hf://nvidia/Cosmos3-Edge/assets/example_i2v_input.jpg]
    output_modalities: [action]
    model_kwargs: {action_mode: policy, robot_state: [0, 0, 0, 0, 0, 0, 0, 0]}
