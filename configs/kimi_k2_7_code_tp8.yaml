model: "kimi_k2_7"
# Fallback TP8 config for local Kimi-K2.7-Code snapshot; prefer the /dev/shm variant.
max_seq_len: 262144
# See kimi_k2_7_code_tp8_shm.yaml — a 1T INT4 load at TP8 outruns PyTorch's
# default process-group timeout; this path is slower still (disk, not tmpfs).
dist_timeout_s: 7200
# Point at your checkpoint at launch — this config hardcodes no path:
#   mstar-serve --config configs/kimi_k2_7_code_tp8.yaml \
#               --model-path /path/to/Kimi-K2.7-Code
# Omit --model-path to pull moonshotai/Kimi-K2.7-Code from HuggingFace.
model_kwargs:
  config_variant: k27_code
  tokenizer_mode: hf
resources:
  kv_cache:
    # Absorbed MLA caches one 576-wide bf16 latent per token (kv_lora_rank 512 +
    # qk_rope_head_dim 64) over 61 layers: 9.0 MB per 128-token page, replicated
    # on every TP rank. 3072 pages = 27.6 GB per rank = 393k tokens: one 262k
    # request plus headroom. Needs more than 80 GB per rank: on 8x H100 the full
    # checkpoint does not fit at TP8, and the 192-expert pruned checkpoint serves
    # with 1536 pages (59 GB per rank after load).
    max_num_pages: 3072
    page_size: 128
node_groups:
  - node_names: [vision_encoder]
    ranks: [0]

  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, prefill_vision, decode]
