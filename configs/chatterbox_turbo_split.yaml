# configs/chatterbox_turbo.yaml with S3Gen on its own worker. Both workers run on GPU 0
# (rank_devices), so T3's decode steps no longer alternate with S3Gen's flow
# solves on one worker loop; run a CUDA MPS daemon for the two workers'
# kernels to overlap. Same graph, resources and checkpoint.
model: "chatterbox_turbo"
# cond (376) + text (<= 512) + speech (<= 4096) tokens; single stream (no CFG)
max_seq_len: 5000
# A request at full text and max_new_tokens_limit speech tokens holds 30
# pages; 50 such requests and the sink page fit in 1536 (checked at startup).
# A full pool would stall decode.
max_concurrent_requests: 50
resources:
  t3_kv:
    # 24 layers x 16 kv heads x 64 dims x bf16 = 96 KB per token
    page_size: 64
    max_num_pages: 1536
node_groups:
  - node_names: [voice_encoder, T3]
    ranks: [0]
    graph_walks: [prefill, prefill_voice, decode]
  - node_names: [s3gen]
    ranks: [1]
    graph_walks: [s3gen_chunk, s3gen_chunk_voice]
rank_devices: {1: 0}
# Two workers share the GPU; each plans its captures within its share.
gpu_memory_fraction: 0.45
model_kwargs:
  max_new_tokens_limit: 1000   # sized with max_concurrent_requests to fit t3_kv
