model: "qwen3_8b"
# configs/qwen3_8b.yaml with DeepSeek's DSpark drafter for Qwen3-8B (deepseek-ai/dspark_qwen3_8b_block7:
# 5 Qwen3 layers reading target layers 1, 9, 17, 25 and 33, a block of 7, a Markov head). The
# drafter runs inside the LLM node on KV of its own, level with the target's, and a decode step
# (the drafter's one pass over the block, the Markov head, the target over the block, the
# verdict, the drafter's context write) replays as one CUDA graph. It drafts 7 every step.
# Greedy replies are the target's; temperature > 0 verifies by rejection sampling. A
# repetition penalty or min_tokens is refused per request. Off: drop `draft`.
max_seq_len: 32768
model_kwargs:
  max_seq_len: 32768
  draft:
    method: dspark
    model: deepseek-ai/dspark_qwen3_8b_block7
    max_drafts: 7
resources:
  kv_cache:
    # 144 KiB a token: 1024 pages of 128 tokens = 131k tokens, 18 GiB
    max_num_pages: 1024
  dspark_kv:
    # 5 layers x 8 KV heads x 128 dims x K and V x bf16 = 20 KiB a token: as many tokens as
    # the target's, 2.5 GiB
    max_num_pages: 1024
node_groups:
  - node_names: [LLM]
    ranks: [0]
