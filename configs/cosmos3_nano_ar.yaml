model: "cosmos3"
# Sequence-length hint for the scheduler. The conductor only asserts its
# presence; the real per-request capacity is the KV pool below.
max_seq_len: 8192
resources:
  kv:
    max_num_pages: 1024
# Windowed-AR serving config: the cosmos3_nano.yaml deployment plus the opt-in
# windowed video walk (enable_windowed_video adds the vae_decoder_ar node and
# its streaming decoder partition; requests opt in per call via window_mode).
# Windowed requests run the eager denoise path, so capture stays enabled only
# for the t2i tiers it already covers.
model_kwargs:
  accelerator_graph: true
  graph_max_latent_area: 2000
  enable_windowed_video: true
  # The streaming decoder keeps each live stream's VAE conv cache (1.33 GiB
  # of tensors per stream at 832x480 in bf16; it grows with the frame area and
  # doubles in fp32). Uncomment to cap the warm streams per decoder copy;
  # streams past the cap take the stateless context re-decode.
  # windowed_decode_max_warm_streams: 0   # 0: no cap
  # Latents per decoder call in the streaming decode (default 1). 0 decodes a
  # steady window's new latents in one call: the decoder alone is ~6% faster at
  # 832x480, but served end to end it is no faster and takes about 15 GiB more
  # peak (832x480 bf16, measured on B200).
  # windowed_decode_latents_per_call: 1
node_groups:
  - node_names: ["dit"]
    ranks: [0]
  - node_names: ["vae_encoder", "vae_decoder", "vae_decoder_ar", "audio_decoder"]
    ranks: [0]
