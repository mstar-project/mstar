model: "deepseek_v41"
# DeepSeek-V4.1-Flash, text only, on one 8-GPU node (TP8): 8x H200 or larger. The 510 GB
# checkpoint is 67 GB a rank as stored; with the routed experts held as stored (36 GB a rank)
# and the dense linears in bf16, the weights served are about 65 GB a rank.
# Resolve the checkpoint through the HF cache (HF_HOME) or pass model_kwargs.checkpoint_path
# (the -1017 refresh has the same layout).
#
# This serves the checkpoint's reference arithmetic in torch, eager: the numerics anchor,
# not a fast path. Not yet run on GPUs: docs/models.rst says what is and is not served.
max_seq_len: 65536
max_concurrent_requests: 8
model_kwargs:
  max_seq_len: 65536
  # requests that hold state at once: the pool below holds one more slot, its sink
  max_requests: 8
  # the routed experts: fp4 as the checkpoint packs them (36 GB a rank), fp8 their exact
  # upcast to E4M3 blocks (68 GB), dense in bf16 (136 GB, past an H200 with the rest)
  moe_experts: fp4
  # what runs them: auto (the default) is a Triton grouped GEMM over the fp4 bytes on a GPU with
  # bf16 tensor cores; torch is the dispatch expert by expert, the arithmetic it is held to
  # moe_kernel: auto
  # the contexts, in tokens, a decode graph is captured for (a step replays the smallest that
  # holds its longest request); unset: 4096, 16384 and max_seq_len
  # capture_contexts: [4096, 16384, 65536]
  # The two Engram tables (203 GB) from host memory instead of 25.3 GB a rank on the GPUs:
  # one read-only mapping of the checkpoint's bytes for all ranks, each step's rows fetched
  # through the host. Same values; its cost per step is not measured on GPUs yet. The host
  # then needs 203 GB of page cache for them.
  # engram_tables: host
resources:
  # A cache per pooling ratio, a row per pooled group, each a latent of 512 and an index key
  # of 128 per source in their FP4 bytes (288 + 68): 890 bytes/token and 0.47 GB/rank together.
  # pages = requests x max_seq_len / ratio / page_size + the sink.
  kv_cache_x1:
    # the source that keeps every token: 8 x 65536 / 128 + 1
    max_num_pages: 4097
    page_size: 128
  kv_cache_x2:
    # the three sources that pool two tokens: 8 x 32768 / 128 + 1
    max_num_pages: 2049
    page_size: 128
  state:
    # max_requests + the sink; 40 windows of 128 x 512 bf16 and the open groups: 5.6 MB/slot
    max_slots: 9
  # with engram_tables: host, the tables' resource. Defaults: 4 MiB staged per copy (a
  # 32 MiB pinned arena per rank), every page read and mapped at startup.
  # engram:
  #   staging_bytes: 4194304
  #   prefault: true
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    # ep_config: {parallel: ep} gives each rank 48 whole experts instead of a slice of all 384
    graph_walks: [prefill, decode]
