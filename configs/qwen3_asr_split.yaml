# The encoder and the decoder in separate worker processes on one GPU, so a decode step never queues
# behind an encoder batch on the same stream. `mps: true` runs both as clients of one MPS daemon so
# their kernels overlap rather than time-slice.
model: "qwen3_asr"
max_seq_len: 65536
# Requests past the cap queue in the conductor. A 20 min file holds about 122
# pages of 128 tokens for its prompt and up to 32 for its transcript, so 2048
# pages hold about 13 of them; at 12 a burst of long files queues instead of
# filling the pool and stalling. The transcription route's 30 s windows hold about
# 4 pages each, so a deployment that sends only those could raise it, as
# qwen3_asr.yaml does; this layout hasn't been measured at a higher cap.
max_concurrent_requests: 12
resources:
  kv_cache:
    max_num_pages: 2048
    cpu_offload_pages: 256
rank_devices: {0: 0, 1: 0}
mps: true
node_groups:
  - node_names: [audio_encoder]
    ranks: [0]
  - node_names: [LLM]
    ranks: [1]
