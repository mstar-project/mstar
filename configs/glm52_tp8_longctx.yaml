model: "glm52"
# GLM-5.2 TP8 with the DSA long-context path. Same box shape as
# glm52_tp8.yaml, minus its speedups, plus the model_kwargs below.
#
# dsa_long_context lifts the context <= index_topk (2048) guard to
# max_seq_len. Indexer layers then keep a per-request k-store outside the
# paged pool: fp32 on CUDA (k_norm autocasts to fp32), ~10.75 KB/token/rank
# across the 21 full-attention layers, ~2.1 GB/rank at 24 x 8192 tokens.
# Decode beyond 2048 runs sparse absorbed attention over each token's
# top-2048 latents. A request that stays within 2048 runs the dense paged
# path bit-identically to glm52_tp8.yaml; batched with a longer one it takes
# the sparse gather instead (fp32, outside the engine's bf16 autocast): same
# selection, but not bitwise equal to the dense path.
#
# Limits, both follow-ups in components/attention.py: prefill prompts must
# still fit index_topk, and serving is eager only, since the indexer's
# per-request host work would not replay in a captured graph.
max_seq_len: 8192
dist_timeout_s: 7200
# A full-window request holds 64 pages (8191 rows): 24 of them fit the pool
# below, so a decode step never finds it empty.
max_concurrent_requests: 24
model_kwargs:
  dsa_long_context: true
  # Becomes config.max_seq_len: the guard bound and the KV sizing input.
  # Must stay <= max_num_pages * page_size per rank.
  max_seq_len: 8192
resources:
  kv:
    # 24 x 64 pages + the sink page the manager holds back. At 1.15
    # KB/token/layer, ~17.7 GB/rank.
    max_num_pages: 1537
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
