model: "glm52"
# GLM-5.2 TP8 past index_topk (2048) on the DSA resource, with glm52_tp8.yaml's kernels:
# each query row attends the 2048 earlier tokens its indexer scores highest. Decode and
# short prefills are captured.
#
# KV per token per rank: 78 MLA layers x (512 + 64) x 2 B + 21 index layers x 128 x 2 B
# ~= 93 KB. Beside ~96 GB/rank of weights, 141 GB GPUs hold about 300k tokens: a 256k
# window (the model's own is 1M).
max_seq_len: 262144
# The pool below holds about one full window. Requests are admitted by their prompts' pages;
# once the live contexts outgrow it, decode waits until requests time out (aux planes rule
# out cpu_offload_pages, so nothing is evicted).
max_concurrent_requests: 64
# A 750 GB load outruns PyTorch's default process-group timeout.
dist_timeout_s: 7200
# NVLS multicast all-reduce, one-shot up to 32 KiB; stays on NCCL, with a
# warning, where NVLink multicast is unavailable.
tp_allreduce: "symm_multimem"
tp_allreduce_max_kb: 32768
tp_async_sched: true
model_kwargs:
  dsa_long_context: true
  # the context guard and the KV sizing input: the pages below, less the sink, must hold it
  max_seq_len: 262144
  # rows per trunk pass of a long prefill, which bounds its activations
  prefill_chunk_tokens: 8192
  # TP ranks split a long prompt's selection (the indexer's cost grows as the prompt squared)
  dsa_shard_prefill: true
  # glm52_tp8.yaml's prefill graphs, to 4096 tokens; a longer prompt prefills eager
  prefill_token_buckets: [
    64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768,
    832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1472, 1536,
    1600, 1664, 1728, 1792, 1856, 1920, 1984, 2048]
  prefill_batched_token_buckets: [256, 512, 1024, 1536, 2048, 2304, 2560, 3072, 3584, 4096]
  prefill_capture_batch_sizes: [1, 4, 16]
resources:
  kv:
    # 2304 x 128-token pages = 295k tokens/rank: one full window and change
    max_num_pages: 2304
    page_size: 128
# An eager prefill compiles its kernels on first use: three lengths (6k, 12.5k and 20k tokens)
# take those compiles before the server binds, not the first long requests.
warmup_requests:
  - {text: "The quick brown fox jumps over the lazy dog. ", repeat: 600, model_kwargs: {max_output_tokens: 4}}
  - {text: "The quick brown fox jumps over the lazy dog. ", repeat: 1250, model_kwargs: {max_output_tokens: 4}}
  - {text: "The quick brown fox jumps over the lazy dog. ", repeat: 2000, model_kwargs: {max_output_tokens: 4}}
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
