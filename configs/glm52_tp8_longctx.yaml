model: "glm52"
# GLM-5.2 TP8 long-context serving: the DSA engine path (opt-in). Same box
# shape as glm52_tp8.yaml; the differences are the model_kwargs below.
#
# dsa_long_context=true lifts the ctx <= index_topk (2048) guard to
# max_seq_len: FULL indexer layers maintain a per-request bf16 k-store
# (~5.4 KB/token/rank across the 21 FULL layers) and decode beyond 2048
# runs sparse absorbed attention over each token's top-2048 selected
# latents (mstar/model/glm52/dsa.py). A request whose whole batch stays
# within 2048 runs the dense paged path bit-identically to glm52_tp8.yaml;
# a within-2048 request BATCHED WITH a beyond-2048 one is routed through
# the fp32 sparse gather instead — same selection (its full prefix), same
# math, but not bitwise-stable against batch composition.
#
# v1 limits (both marked follow-ups in components/attention.py):
#   - prefill prompts must still fit index_topk (sparse prefill pending);
#   - serving is eager-only (DSA upkeep is host-side per-request work a
#     captured CUDA graph would not replay) — moot today, since the
#     fp8-resident reference MoE dispatch already registers no graphs.
# The indexer k-store is bf16 out-of-pool; the reference 132 B/token fp8
# paged layout is the perf follow-up (dsa-indexer-spec.md section 2).
max_seq_len: 8192
dist_timeout_s: 7200
model_kwargs:
  dsa_long_context: true
  # Consumed by Glm52Model: becomes config.max_seq_len (the guard bound and
  # KV sizing input). Must stay <= max_num_pages * page_size per rank.
  max_seq_len: 8192
kv_cache:
  # 8192-token requests at 1.15 KB/token/layer latent pages: 512 x 128-token
  # pages = 64k cached tokens/rank = 8 concurrent full-window requests.
  max_num_pages: 512
  page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
