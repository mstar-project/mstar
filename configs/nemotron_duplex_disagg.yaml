# NVIDIA NemotronLabs VoiceChat-11B — disaggregated duplex layout.
#
# Each streaming consumer runs on its own GPU / worker thread so the
# frame-synchronous decode loop, the talker loop, and the codec run in a
# pipeline instead of serializing on one GPU thread. The colocated single-GPU
# layout (configs/nemotron_duplex.yaml) also works and produces identical
# output; this layout trades GPUs for pipeline parallelism / throughput.
# Encoder + LLM share rank 0: encoder steps (one per chunk of the user's audio,
# all live calls batched) interleave with the LLM's frame steps.
#
#   rank 0: conformer_encoder (Encoder) + nano_llm (LLM)
#   rank 1: eartts_talker     (Talker)
#   rank 2: audio_codec       (Codec)
model: "nemotron_duplex"
max_seq_len: 12288

# One recurrent slot per session (DEFAULT_MAMBA_SLOTS); past it the engine spins
# on admit and wedges every session. Keep the two equal; the overflow queues.
max_concurrent_requests: 32

# A live call's input files over its whole life; past it the call ends with a
# 400. 160 s of 16 kHz audio is about 10 MB as float32 WAV: 32 leaves room for
# stereo or a 48 kHz opening clip. A file is decoded at most one frame past
# max_session_s and refused if it gets there (a header that understates its
# length cuts it short instead).
max_call_input_mb: 32

# An upload longer than max_session_s gets a 400, and so does a live call whose
# appends pass it (audio_in's max_items, in samples). The talker KV pool is
# sized so 32 sessions that long fit at once (160 s: 1025 pages, 28 GiB); a
# longer cap grows it in step. A full talker pool stalls every session.
model_kwargs:
  max_session_s: 160
  # Longer system prompts get a 400; the prompt prefills in one step that
  # stalls every live session (~2.75 ms/token). TODO(prefill): drop once chunked.
  max_prompt_tokens: 512

node_groups:
  - node_names:
      - conformer_encoder
      - nano_llm
    ranks:
      - 0

  - node_names:
      - eartts_talker
    ranks:
      - 1

  - node_names:
      - audio_codec
    ranks:
      - 2
