model: "phi4mm"
# the checkpoint's context (max_position_embeddings), which the KV cache is sized for
max_seq_len: 131072
node_groups:
  # Colocated: each encoder runs once per request, then idles.
  - node_names: [LLM, vision_encoder, audio_encoder]
    ranks: [0]
resources:
  # The checkpoint's vision (rank 256) and speech (rank 320) adapters, which the
  # model picks per request from its media; a slot each, beside the zero adapter.
  lora:
    max_slots: 2
    max_rank: 320
# A step's host work on the main thread: at c=128 the GPU and plan threads slowed
# every phase of the step (5.5 against 7.1 ms a step, H200); level at c<=64.
knobs:
  step_threads: serial
