model: "qwen3_omni"
max_seq_len: 32768
# The Thinker's KV pool defaults to 2,048 pages, 24 GiB at 12 MiB a page, which
# doesn't fit beside its weights on an 80 GB GPU; qwen3omni_2gpu_large_kv.yaml
# keeps the default for larger GPUs. Host pages give a full pool a request to move.
resources:
  thinker_kv:
    max_num_pages: 1024
    cpu_offload_pages: 1024
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
# On AMD GPUs Code2Wav gets its own worker on the Talker's GPU (rank_devices),
# the layout of qwen3omni_2gpu_split.yaml, so Talker steps no longer take turns
# with Code2Wav steps on one worker loop. MI325X, text c=32: 168 audio-s/s
# against 135 on one worker, the same at c=1. qwen3omni_2gpu_stock.yaml keeps
# one worker on every platform.
platform_overrides:
  rocm:
    node_groups:
      - node_names: [audio_encoder, vision_encoder]
        ranks: [1]
      - node_names: [Thinker]
        ranks: [1]
      - node_names: [Talker]
        ranks: [0]
      - node_names: [Code2Wav]
        ranks: [2]
    rank_devices: {2: 0}
