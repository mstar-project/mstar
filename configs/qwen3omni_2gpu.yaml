model: "qwen3_omni"
max_seq_len: 32768
# The Thinker's KV pool holds 1,024 GPU pages (128k tokens; its default 2,048, 24 GiB at
# 12 MiB a page, doesn't fit beside the weights on an 80 GB GPU) plus 1,024 host pages
# that give a full pool a request to move. Its text prefill ladder stays at the default
# 128-2048. Whether every capture fits beside this pool on an 80 GB GPU such as the
# H100 is unmeasured; qwen3omni_2gpu_h100.yaml is the H100 placement. On H200-class
# GPUs, when concurrent requests hold more than 128k tokens of Thinker KV, serve
# qwen3omni_2gpu_large_kv.yaml, which keeps 2,048 pages (256k tokens) on the GPU; see
# the Qwen3-Omni notes in docs/models.rst for its caveats.
resources:
  thinker_kv:
    max_num_pages: 1024
    cpu_offload_pages: 1024
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  
  - node_names: [Talker]
    ranks: [0]
  
  - node_names: [Code2Wav]
    ranks: [0]
# On AMD GPUs Code2Wav gets its own worker on the Talker's GPU (rank_devices),
# the layout of qwen3omni_2gpu_split.yaml, so Talker steps no longer take turns
# with Code2Wav steps on one worker loop. MI325X, text c=32: 168 audio-s/s
# against 135 on one worker, the same at c=1. qwen3omni_2gpu_stock.yaml keeps
# one worker on every platform.
# Audio there also starts after 4 codec frames, the ramp of
# qwen3omni_2gpu_ramp4g.yaml. MI325X: TTFA p50 78 vs 127 ms at c=1, 263 vs 413 at
# c=32, audio-s/s equal, 0-2 % paused requests at c=32.
# qwen3omni_2gpu_split.yaml is the same layout without the ramp.
platform_overrides:
  rocm:
    model_kwargs:
      codec_chunk_schedule: [4, 5, 6, 8, 10, 13, 16, 20]
    node_groups:
      - node_names: [audio_encoder, vision_encoder]
        ranks: [1]
      - node_names: [Thinker]
        ranks: [1]
      - node_names: [Talker]
        ranks: [0]
      - node_names: [Code2Wav]
        ranks: [2]
    rank_devices: {2: 0}
