model: "z_image_turbo"

# Z-Image-Turbo (6B single-stream flow DiT, Qwen3-4B captions, FLUX.1 VAE), single GPU.
# max_seq_len only satisfies the conductor's config check (prompts are truncated to 512).
max_seq_len: 512

model_kwargs:
  # sdpa (cuDNN on H100) is the reference kernel; auto runs the DiT's joint attention on the
  # engine's ragged attention resource with the platform's default kernel (FlashInfer FA3 on
  # NVIDIA GPUs, AITER's asm flash attention on MI300X/MI325X, where torch's sdpa is AOTriton)
  attention_backend: sdpa
  compile: true
  # inductor rounds intermediates where eager PyTorch does (and fuses no FMAs); on its own the compiled
  # transformer is still not bit-exact with the eager path (measured PSNR: compile_exact_ops in docs/models.rst)
  compile_eager_rounding: true
  # compile_exact_ops keeps op classes on the eager kernels inside the compiled forward. On Z-Image the cost is the
  # 180 norm graph breaks per step (see compile_exact_ops in docs/models.rst). Default: the fast plain compile; set
  # [norms] for reference-faithful output.
  compile_exact_ops: false
  accelerator_graph: true
  # [height, width]: 1024^2 and 1344x768, the two sizes of the image benchmark set; an uncaptured size compiles per
  # batch size inside its first requests and decodes on the eager VAE.
  capture_sizes: [[1024, 1024], [768, 1344]]
  # Captions pad to multiples of 32 up to max_seq_len, so cap_len has 16 possible
  # values -- and it is an INPUT, not a shape: the DiT substitutes a learned
  # cap_pad_token at every padded position and attends over it, so a prompt cannot
  # be padded up into a wider bucket without changing the image. A cap_len with no
  # captured graph falls back to the eager batched path.
  #
  # The capture budget per size is len(capture_caption_lengths) x len(capture_batch_sizes) graphs.
  # A step of 3 or 5-7 rows would replay the next captured size with dummy rows; at 16 concurrent
  # requests steps average 5.7 rows, so with only 1/2/4/8 captured about 30% of a step's rows would
  # be dummies. Capturing every batch size pays under concurrency (requests at different steps, one
  # or two outside the dit). H200, 1024^2, 8 steps, 2 rounds (before the fused q/k norm + rotary):
  # c=4 1.05-1.08 -> 1.22 images/s, c=8 1.12-1.14 -> 1.21-1.22,
  # c=16 1.17-1.19 -> 1.23, c=1 unchanged, same peak VRAM. But each graph is a compile of its own:
  # 32 graphs start ~100 s slower than 16 on a warm Inductor cache, ~8 min slower on a cold one,
  # and the 64 graphs of the two sizes cost 5.3 GiB of VRAM and take a warm start from about 96 s to about 220 s on MI325X.
  # The text encoder captures its own geometric_batch_sizes: powers of two below max_batch_size,
  # then max_batch_size (4 graphs here, any caption length).
  capture_caption_lengths: [32, 64, 96, 128]
  # every batch size up to max_batch_size; [1, 2, 4, 8] halves the graphs for deployments that start cold often
  capture_batch_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  max_batch_size: 8
  # compiled VAE decode (max-autotune), not bit-exact with the eager decode: before the folded upsample and split
  # GroupNorm it was 3x faster at 1024^2 and ~56 dB from eager, and the autotuner may pick other conv kernels in another
  # server process (~64 dB apart). vae_compile: false for bit-exact, repeatable output
  vae_compile: true
  # async_scheduling (default true): the worker assembles the next denoise step while the current one runs and merges
  # newly ready requests into it; `false` = lockstep, within a few percent (see docs/models.rst)

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
