model: "z_image_turbo"

# Z-Image-Turbo (6B single-stream flow DiT, Qwen3-4B captions, FLUX.1 VAE), single GPU.
# max_seq_len only satisfies the conductor's config check (prompts are truncated to 512).
max_seq_len: 512

model_kwargs:
  # sdpa (cuDNN on H100) served as fast as FlashInfer FA3 (0.349 vs 0.355 s at B=1) and is the
  # reference kernel; flashinfer stays available
  attention_backend: sdpa
  compile: true
  # inductor rounds intermediates like eager PyTorch: keeps the compiled transformer at the
  # reference's numerics (without it the served images drift to 35-39 dB on a 4-step sampler)
  compile_eager_rounding: true
  cuda_graph: true
  capture_sizes: [[1024, 1024]]
  # captions are padded to multiples of 32 tokens; graphs are captured for these lengths
  capture_caption_lengths: [32, 64]
  capture_batch_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  max_batch_size: 8
  # compiled VAE decode (max-autotune): 3x faster at 1024^2, ~56 dB from the eager decode
  vae_compile: true

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
