model: "qwen3_5_4b"
max_seq_len: 32768
# GIL switch interval of the API server process (see docs/serving.rst):
# token streaming keeps three of its threads busy
api_switch_interval_s: 0.001
node_groups:
  # Text, images and video. Colocated: the
  # encoder runs once per request, then idles.
  - node_names: [LLM, vision_encoder]
    ranks: [0]
resources:
  gdn_state:
    max_slots: 129
    # state_dtype: bfloat16  # default: the checkpoint's mamba_ssm_dtype (float32)

# The vision encoder's embed and merger compile (dynamic) on the first image;
# these two sizes (64 and 608 image tokens) take that compile and warm two of
# the captured block loop's buckets before the server binds.
warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
