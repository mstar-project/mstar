model: "qwen3_5_4b"
max_seq_len: 32768
node_groups:
  # Text, images and video. Colocated: the
  # encoder runs once per request, then idles.
  - node_names: [LLM, vision_encoder]
    ranks: [0]
platform_overrides:
  rocm:
    # Twice the GDN state's memory, for a decode step that reads a request's state from one slot
    # and writes it to the other. Same values.
    resources:
      gdn_state:
        max_slots: 129
        prefix_slots: 128
        twin_slots: true
resources:
  gdn_state:
    max_slots: 129
    # GDN state snapshots at page boundaries for the prefix cache, kept across requests and
    # evicted oldest first. A prefill keeps up to two, and each takes a request slot's memory.
    prefix_slots: 128
    # state_dtype: bfloat16  # default: the checkpoint's mamba_ssm_dtype (float32)

# The vision encoder compiles on its first image shape and recompiles dynamic
# on the second (~1.5 s each); these two sizes (64 and 608 image tokens) take
# both compiles before the server binds.
warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
