model: "ltx2_5"

max_seq_len: 1024

# The DiT uses Ulysses SP2. The video VAE has full weights and latents on both
# ranks; its TP2 node group splits independent spatial tiles over those ranks.
# Untiled and framewise decodes keep the stock path.
model_kwargs:
  max_batch_size: 4
  vae_compile: true
  capture_shapes: [[544, 960, 121, 24]]
  vae_compile_shapes: [[544, 960, 121, 24], [1088, 1920, 121, 24]]
  capture_batch_sizes: [1, 2]

node_groups:
  - node_names: [dit]
    ranks: [0, 1]
    sp_size: 2
  - node_names: [text_encoder]
    ranks: [1]
  - node_names: [vae_decoder]
    ranks: [0, 1]
    tp_size: 2
  - node_names: [audio_decoder, latent_upsampler]
    ranks: [0]
