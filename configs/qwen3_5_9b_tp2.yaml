model: "qwen3_5_9b"
max_seq_len: 32768
# Raise the gen-0 GC threshold: at CPython's 700 a 128-row decode step
# collects almost every step and runs a full collection every few hundred.
knobs:
  gc_gen0_threshold: 50000
# Captured text-prefill ladder (see docs/models.rst): the powers of two to
# 2048, and 2176 for a mixed step's decode rows beside four prompts. The LLM's
# 2048-token step budget caps prefill and mixed steps, so no bucket past 2176
# is reached.
model_kwargs:
  prefill_token_buckets: [32, 64, 128, 256, 512, 1024, 2048, 2176]
node_groups:
  # Text, images and video. Colocated: the
  # encoder runs once per request, then idles.
  - node_names: [vision_encoder]
    ranks: [0]
  - node_names: [LLM]
    ranks: [0, 1]
    tp_size: 2

resources:
  gdn_state:
    max_slots: 129
    # state_dtype: bfloat16  # default: the checkpoint's mamba_ssm_dtype (float32)

# The vision regions compile at start-up; these two sizes (64 and 608 image
# tokens) warm two of the captured block loop's buckets and the LLM's vision
# prefill before the server binds.
warmup_requests:
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/example_action_fd_umi_first_frame.png]
    model_kwargs: {max_output_tokens: 4}
  - text: What is in this image?
    files: [hf://nvidia/Cosmos3-Edge/assets/edge_action_id_av_0_output.png]
    model_kwargs: {max_output_tokens: 4}
