model: "lingbot_world_1_3b"

# max_seq_len only satisfies the conductor's config check and matches the UMT5
# text length; the dit's rolling K/V live in its own store (resources below).
max_seq_len: 512

# Numerics (model_kwargs), shown at their defaults. reference_numerics: true runs
# the reference's: FA2 attention (needs flash-attn), an eager DiT, the fp32
# contiguous encode and decode, with which the rollout is bit-identical to the
# reference's. The default runs the engine's ragged attention, compiled DiT
# blocks, a channels-last encode and a bf16 (cuDNN >= 9.16), channels-last,
# compiled decode; the compiles happen at load for 464x832, the output size of
# a 480x832 image (LingBotWorldModel.geometry).
# model_kwargs:
#   reference_numerics: false
#   dit_compile_autotune: false

# One rollout at a time; the model refuses any other value. Each rollout's text
# K/V (90 MiB) and VAE caches live outside the K/V pool below, so this is their
# only bound until they are engine resources.
max_concurrent_requests: 1

# K/V memory for the DiT, reserved at startup. 64800 tokens = 11.1 GiB: room for
# one rollout at the largest size (720x1280); one at the default size (464x832)
# takes 4.7 GiB.
resources:
  dit_kv:
    pool_tokens: 64800

# Single-GPU colocated; the Wan VAE encode and decode are fused into the dit forward.
node_groups:
  - node_names: [text_encoder, dit]
    ranks: [0]
