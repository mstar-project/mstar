# Speculative variant (3 drafts per step) of kimi_k3_tiny.yaml: the served greedy texts must equal the plain ones.
# Kimi K3 architecture smoke deployment: the random-weight 0.4B test checkpoint
# (inference-optimization/Kimi-K3-0.40B) on one GPU. Same code path as the real
# model; only the checkpoint directory differs.
model: "kimi_k3"
max_seq_len: 4096
model_kwargs:
  speculative_tokens: 3   # speculative decoding: k drafts verified per step (stand-in draft until DSpark lands)
  checkpoint_dir: /scratch/m000137-pm06/atj10/kimi_k3_mstar/ref/tiny_kimi_k3
  max_output_tokens: 256
node_groups:
  - node_names: [LLM]
    ranks: [0]
    graph_walks: [prefill, decode]
resources:
  mla_kv:
    max_num_pages: 512
    page_size: 64
  kda_state:
    max_slots: 129
