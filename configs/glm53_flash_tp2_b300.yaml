model: "glm5_next"
# GLM-5.3-Flash (zai-org/GLM-5.3-Flash, 328 GB fp8) on 2x B300 (275 GB): ~165 GB/rank of
# weights (the routed experts fp8, the rest bf16). glm5_next_tp8.yaml's comments cover the
# keys the two share; only the KDA state per slot grows (4x at TP2).
max_seq_len: 2048
# One request per KDA slot below.
max_concurrent_requests: 64
# FlashInfer's one-kernel all-reduce: ~9.5 us vs NCCL's 31-49 per decode all-reduce on B300
tp_allreduce: "flashinfer"
# a 4096-token prefill bucket moves 32 MiB per all-reduce
tp_allreduce_max_kb: 32768
tp_async_sched: true
model_kwargs:
  moe_quant_kernel: "auto"
  mtp_num_draft_tokens: 0
  prefill_graphs: true
resources:
  attn:
    # captured one-token decode on trtllm-gen's MLA kernel where its load probe matches
    decode_fmha: true
  kv_cache:
    # the 11 MLA layers' 512-wide latents, ~11.3 KB/token: a full window per KDA slot plus
    # the sink page, ~1.5 GB/rank
    max_num_pages: 1025
    page_size: 128
  kda_state:
    # 64 requests plus the sink, head-sharded like the KDA layers: ~74 MB/slot/rank at TP2,
    # ~4.8 GB/rank. The real slots also cap the decode batch and its captured sizes.
    max_slots: 65
node_groups:
  - node_names: [LLM]
    ranks: [0, 1]
    tp_size: 2
    graph_walks: [prefill, decode]
