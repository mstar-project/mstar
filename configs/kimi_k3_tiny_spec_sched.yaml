# Speculative variant of kimi_k3_tiny.yaml with a block length that follows the batch size (3 drafts up to 2 rows,
# 1 up to 4, none beyond): the served greedy texts must equal the plain ones whatever the batch composition.
# Kimi K3 architecture smoke deployment: the random-weight 0.4B test checkpoint
# (inference-optimization/Kimi-K3-0.40B) on one GPU. Same code path as the real
# model; only the checkpoint directory differs.
model: "kimi_k3"
max_seq_len: 4096
model_kwargs:
  speculative_schedule: {2: 3, 4: 1, 8: 0}   # drafts per row by step size (eager here: any bounds)
  checkpoint_dir: /scratch/m000137-pm06/atj10/kimi_k3_mstar/ref/tiny_kimi_k3
  max_output_tokens: 256
node_groups:
  - node_names: [LLM]
    ranks: [0]
    graph_walks: [prefill, decode]
resources:
  mla_kv:
    max_num_pages: 512
    page_size: 64
  kda_state:
    max_slots: 129
