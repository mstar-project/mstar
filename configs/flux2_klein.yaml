model: "flux2_klein"

# Every klein node is stateless except the dit's cacheless ragged attention; max_seq_len
# only satisfies the conductor's config check (the 512-token prompt).
max_seq_len: 512

# FLUX.2 [klein] 4B, single GPU, all four nodes colocated. Serving knobs (forwarded to
# Flux2KleinModel.__init__): attention_backend auto|sdpa|flashinfer, torch.compile of the
# transformer per shape, CUDA-graph capture of the denoise step for the listed
# (height, width) shapes and batch sizes (other shapes run the eager batched path).
model_kwargs: &model_kwargs
  # text_encoder_max_batch_size: prompts in one text encoder step, max_batch_size unless set. Default batched, 1 on AMD
  # GPUs (platform_overrides below). Whether NVIDIA's text encoder depends on the batch size the same way is unmeasured
  # sdpa (cuDNN on H100) is the reference kernel; auto runs the DiT's joint attention on the
  # engine's ragged attention resource with the platform's default kernel (FlashInfer FA3 on
  # NVIDIA GPUs, AITER's asm flash attention on MI300X/MI325X, where torch's sdpa is AOTriton)
  attention_backend: sdpa
  compile: true
  # inductor rounds intermediates where eager PyTorch does (and fuses no FMAs); on its own the compiled
  # transformer is still not bit-exact with the eager path (measured PSNR: compile_exact_ops in docs/models.rst)
  compile_eager_rounding: true
  # op classes kept on the eager result inside the compiled forward: with the norms kept the compiled
  # transformer was bit-exact with the eager one (measured while the q/k norms were graph breaks; the
  # activations add nothing but graph breaks), and with vae_compile: false so was every served image
  # (see compile_exact_ops in docs/models.rst)
  # On AMD GPUs the bf16 config does not apply this (`knobs: dit_exact_ops`, off there by default): hipBLASLt's per-M
  # kernel choice keeps the output off the reference bit for bit either way. MI325X: 0.406 -> 0.384 s at B=1, 2.97 -> 3.32
  # images/s at c=16. This file's AMD default is fp8, which needs it, so the override below turns the knob on.
  compile_exact_ops: [norms]
  accelerator_graph: true
  # [height, width]: 1024^2 and 1344x768, the two sizes of the image benchmark set; an uncaptured size compiles
  # per batch size inside its first requests and decodes on the eager VAE. Edits keep the one bucket. MI325X: the
  # first 1344x768 request takes 0.4-0.7 s instead of 1.4-1.7 (86 s on a cold server); warm startup 63 -> 72-84 s.
  capture_sizes: [[1024, 1024], [768, 1344]]
  capture_edit_sizes: [[1024, 1024]]
  # every batch size up to max_batch_size: a lockstep group of 5-7 requests would otherwise be padded into the 8-graph.
  # The text encoder captures its own geometric_batch_sizes: powers of two below max_batch_size, then max_batch_size
  # (one graph each)
  capture_batch_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  max_batch_size: 8
  # compiled VAE decode (max-autotune), not bit-exact with the eager decode: before the folded upsample and split
  # GroupNorm it was 3x faster at 1024^2 and ~56 dB from eager, and the autotuner may pick other conv kernels in another
  # server process (~64 dB apart). vae_compile: false for bit-exact, repeatable output
  vae_compile: true
  # linear_dtype: fp8 runs the DiT blocks' linears as fp8 GEMMs (MI300X/MI325X/MI355X, Hopper+): 1.19x images/s at
  # c=1 and 1.21x at c=16 on MI325X; median 22.6 vs 23.9 dB from diffusers (docs/models.rst). Default bf16, fp8 on
  # AMD GPUs (platform_overrides below)
  # On AMD GPUs fp8 needs `knobs: dit_exact_ops: true` (top level). MI325X: 22.6 dB with the knob on, 22.5-22.7
  # with it off (floor 22.4). The knob costs 7% of fp8 images/s at c=1, leaving 1.13x bf16
  # linear_dtype_steps picks the dtype per denoise step (docs/models.rst): [bf16, bf16, fp8, fp8] loses 0.1 dB on the
  # typical image against bf16 on MI325X, 1.0 dB with fp8 on every step, and keeps about half of the speedup
  # async_scheduling (default true): the worker assembles the next denoise step while the current one runs and merges
  # newly ready requests into it; `false` = lockstep, within a few percent (see docs/models.rst)
  # linear_dtype: bf16 (default), mxfp8 or nvfp4 runs the block linears through a block-scaled GEMM, faster and
  # further from the bf16 image of the same seed; linear_keep_bf16 and linear_dtype_steps keep some linears or steps
  # in bf16. See docs/models.rst before turning it on
  # LoRA adapters folded into the transformer at load (diffusers / PEFT or BFL-layout
  # safetensors; ``scale`` multiplies the adapter). Example:
  # lora:
  #   - {path: /path/to/klein-style.safetensors, scale: 0.8}

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]

# On AMD GPUs all 60 of the DiT's declared linears run fp8, with the norms on the eager kernels. An entry replaces a
# top-level key whole, so model_kwargs repeats the block above through the merge key. MI325X at c=1/4/8/16: 3.157 / 3.586 /
# 3.494 / 3.647 images/s against 2.775 / 3.107 / 3.181 / 3.313 on bf16, median 22.59 dB from diffusers (floor 22.43).
# The typical image loses 1.0 dB against bf16 and the worst 11.4 dB, accepted by eye on the 40 image_v1 images.
# flux2_klein_bf16.yaml keeps bf16 on every platform. flux2_klein_fp8_bpff.yaml loses at most 1.65 dB for about
# 40% of the gain.
# Each prompt encodes alone, the DiT and VAE keep batching. MI325X, shared node: a c=16 image reads 30-34 dB from its c=1 twin
# against 25-26 batched (41 against 26 on bf16). c=16 images/s stay level, c=4 loses 4%, and the distance from diffusers does not move.
platform_overrides:
  rocm:
    model_kwargs:
      <<: *model_kwargs
      # AITER's asm flash attention through the ragged resource; torch's sdpa is AOTriton here
      attention_backend: auto
      # prompts encode one at a time: the batched encode's padding costs more than it saves here
      text_encoder_max_batch_size: 1
      linear_dtype: fp8
      # the text stream's linears (512 rows) are no faster in fp8
      linear_keep_bf16: ["double_blocks.*.attn.txt_*", "double_blocks.*.txt_ff.*"]
    knobs:
      dit_exact_ops: true
