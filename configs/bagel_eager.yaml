model: "bagel"
max_seq_len: 32768

disable_torch_compile_nodes: [LLM]
disable_cuda_graph_nodes: [LLM]

node_groups:
  - node_names:
      - vit_encoder
    ranks:
      - 0
  
  - node_names:
      - vae_encoder
      - vae_decoder
    ranks:
      - 0
  
  - node_names:
      - LLM
    ranks:
      - 1
