model: "flux2_klein"

# fp8 on every step and every declared linear, on every platform: flux2_klein.yaml explains the settings and why this is not its
# AMD default. MI325X, shared node: 3.152 / 3.410 / 3.489 / 3.593 images/s at c=1/4/8/16 with the solo text encoder, median 22.59 dB
# from diffusers at c=1, 22.44 at c=16 (floor 22.43).
max_seq_len: 512

model_kwargs: &model_kwargs
  linear_dtype: fp8
  attention_backend: auto
  compile: true
  compile_eager_rounding: true
  compile_exact_ops: [norms]
  accelerator_graph: true
  capture_sizes: [[1024, 1024], [768, 1344]]
  capture_edit_sizes: [[1024, 1024]]
  capture_batch_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  max_batch_size: 8
  vae_compile: true

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]

knobs:
  dit_exact_ops: true

platform_overrides:
  rocm:
    model_kwargs:
      <<: *model_kwargs
      text_encoder_max_batch_size: 1
