model: "zonos2"
# The checkpoint's max_seqlen (6144) is the real limit; this key is only
# required by the conductor.
max_seq_len: 6144
# Requests past this wait in the conductor's queue. A shared data-worker
# thread falls behind above ~200 streams and then fails whole bursts.
max_concurrent_requests: 128
# Single-GPU: the LLM (prefill + decode), the DAC vocoder and the voice-clone
# speaker encoder all share rank 0.
#
# speaker_encoder holds the voice-clone ECAPA-TDNN resident. Despite the "1.7B"
# in its HF repo id it is only ~12M params (~48 MB in fp32), so colocating it
# costs almost nothing. Drop its node group to serve text-only; voice-clone
# requests then fail rather than silently ignoring the reference audio.
node_groups:
  - node_names: [LLM]
    ranks: [0]
    graph_walks: [prefill, prefill_clone, decode]
  - node_names: [speaker_encoder]
    ranks: [0]
    graph_walks: [prefill_clone]
  - node_names: [dac_decoder]
    ranks: [0]
    graph_walks: [dac_chunk]
