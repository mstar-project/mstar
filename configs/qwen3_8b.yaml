model: "qwen3_8b"
# Qwen/Qwen3-8B, bf16, plain decoding. configs/qwen3_8b_dspark.yaml adds a DSpark drafter.
max_seq_len: 32768
model_kwargs:
  max_seq_len: 32768
resources:
  kv_cache:
    # 144 KiB a token (36 layers x 8 KV heads x 128 dims x K and V x bf16)
    max_num_pages: 1024
node_groups:
  - node_names: [LLM]
    ranks: [0]
