model: "qwen3_8b"
# Qwen/Qwen3-8B, bf16. The serving config requires max_seq_len but nothing reads it
# (docs/serving.rst); a request is bounded by the checkpoint's max_position_embeddings.
max_seq_len: 40960
resources:
  kv_cache:
    # 144 KiB a token (36 layers x 8 KV heads x 128 dims x K and V x bf16)
    max_num_pages: 1024
node_groups:
  - node_names: [LLM]
    ranks: [0]
