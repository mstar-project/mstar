model: "minimax_h3"

# Required by the config schema. No node keeps a KV cache, so nothing is sized from it: the
# prompt is bounded by the text encoder's positions (model_kwargs max_prompt_tokens can set
# a lower bound) and the packed sequence by max_packed_rows.
max_seq_len: 8192

# MiniMax-H3 (FL2VA) on 4 GPUs: the DiT (66 GB) Ulysses sequence-parallel over all four,
# each rank holding the whole DiT and a quarter of the packed rows, so only the attention
# exchanges them; its blocks compiled. The Qwen3-VL-32B conditioner (~53 GB for the 50
# layers it runs) on rank 0; the keyframe encoder, the audio decoder and the video
# combine on rank 1. The video decode is split by clips over the four ranks
# (vae_decoder_<i>, 28 tiles a call) and cross-faded by video_combine. Measured settings
# and times: docs/models.rst.
model_kwargs:
  attention_backend: flashinfer
  compile: true
  vae_tile_batch: 28
  vae_parallel: 4

node_groups:
  - node_names: [dit]
    ranks: [0, 1, 2, 3]
    sp_size: 4
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, audio_decoder, video_combine]
    ranks: [1]
  - node_names: [vae_decoder_0]
    ranks: [0]
  - node_names: [vae_decoder_1]
    ranks: [1]
  - node_names: [vae_decoder_2]
    ranks: [2]
  - node_names: [vae_decoder_3]
    ranks: [3]
