model: "minimax_h3"

# Required by the config schema. No node keeps a KV cache, so nothing is sized from it: the
# prompt is bounded by the text encoder's positions (model_kwargs max_prompt_tokens can set
# a lower bound) and the packed sequence by max_packed_rows.
max_seq_len: 8192

# MiniMax-H3 (FL2VA) on 4 GPUs: the DiT (66 GB) Ulysses sequence-parallel over all four,
# each rank holding the whole DiT and a quarter of the packed rows, so only the attention
# exchanges them. The video decode runs as a node of the same SP instance, each rank decoding
# its share of the clips, so rank 0 schedules it between denoise steps on all four. Both
# compiled. The Qwen3-VL-32B conditioner (~53 GB for the 50 layers it runs) and the audio
# decoder on rank 0, the keyframe encoder on rank 1. Measured settings and times:
# docs/models.rst.
model_kwargs:
  attention_backend: flashinfer
  compile: true
  vae_tile_batch: 28
  vae_compile: true

node_groups:
  - node_names: [dit, vae_decoder]
    ranks: [0, 1, 2, 3]
    sp_size: 4
  - node_names: [text_encoder, audio_decoder]
    ranks: [0]
  - node_names: [vae_encoder]
    ranks: [1]
