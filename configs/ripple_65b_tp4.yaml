model: "ripple_65b"
max_seq_len: 131072

resources:
  kv_cache:
    # What bounds a request; the checkpoint's own limit is 2M tokens. Its RoPE table follows.
    max_seq_len: 131072
    # 80 layers x 8 KV heads x 128 dims x 2 (k, v) x bf16 = 320 KiB a token, so 80 GiB over
    # the TP group (pages of 128 tokens of every layer, whatever page the window derives). A
    # request holds every token of the 16 full layers but only the last ~1024 of the 64
    # sliding ones (all of a prompt's until its prefill commits).
    max_num_pages: 2048
    # a pool that keeps a window doesn't prefix cache yet
    prefix_cache: false

node_groups:
  # ~130 GB of bf16 weights: four 80 GB GPUs
  - node_names: [LLM]
    ranks: [0, 1, 2, 3]
    tp_size: 4
