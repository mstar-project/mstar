model: "pi05"
max_seq_len: 2048

# FA2, not the FA3 kernel "auto" picks on SM90. On an H200 the action step's few queries over a
# long prefix run 3.9 ms faster, and prefill, which shares this resource, 0.3 ms slower.
resources:
  attn:
    flashinfer_backend: fa2

node_groups:
  - node_names:
      - vit_encoder
    ranks:
      - 0

  - node_names:
      - LLM
      - action_expert
    ranks:
      - 0
