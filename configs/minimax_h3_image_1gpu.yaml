model: "minimax_h3_image"

# See minimax_h3_image.yaml.
max_seq_len: 8192

# MiniMax-H3-Image on one GPU with room for both: the DiT, the conditioner and the VAE
# (~130 GiB loaded, plus the DiT's activations; a B200 / B300, or an H200 at 4 MP).
model_kwargs:
  compile: true
  # tiles per decoder call: one at a time leaves the decode launch-bound (9.2 s for a 16 MP
  # image on a B300, 0.45 s at 64), and the batched decode is bit-identical
  vae_tile_batch: 64
  # the last 16 prompts' text rows, as SGLang's conditioning cache: a repeated prompt (and
  # references) skips the text encoder and gets the same image
  text_cache_entries: 16
  # the decoder's blocks compiled per tile batch (56-58 dB from eager)
  vae_compile: true

node_groups:
  - node_names: [dit, text_encoder, vae_encoder, vae_decoder]
    ranks: [0]
