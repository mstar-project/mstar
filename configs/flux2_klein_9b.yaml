model: "flux2_klein_9b"

# FLUX.2 [klein] 9B (Qwen3-8B text encoder + 4096-wide DiT): same graph and knobs as the
# 4B config. The 9B weights are released under the FLUX Non-Commercial License v2.1,
# not Apache-2.0; check the license before deploying.
max_seq_len: 512

model_kwargs:
  # sdpa (cuDNN on H100) served as fast as FlashInfer FA3 (0.349 vs 0.355 s at B=1) and is the
  # reference kernel; flashinfer stays available
  attention_backend: sdpa
  compile: true
  # inductor rounds intermediates like eager PyTorch: keeps the compiled transformer at the
  # reference's numerics (without it the served images drift to 35-39 dB on a 4-step sampler)
  compile_eager_rounding: true
  cuda_graph: true
  capture_sizes: [[1024, 1024]]
  capture_batch_sizes: [1, 2, 3, 4]
  max_batch_size: 4
  # compiled VAE decode (max-autotune): 3x faster at 1024^2, ~56 dB from the eager decode
  vae_compile: true

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
