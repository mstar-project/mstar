model: "flux2_klein_9b"

# FLUX.2 [klein] 9B (Qwen3-8B text encoder + 4096-wide DiT): same graph and knobs as the
# 4B config. The 9B weights are released under the FLUX Non-Commercial License v2.1,
# not Apache-2.0; check the license before deploying.
max_seq_len: 512

model_kwargs:
  # sdpa (cuDNN on H100) served as fast as FlashInfer FA3 (0.349 vs 0.355 s at B=1) and is the
  # reference kernel; flashinfer stays available
  attention_backend: sdpa
  compile: true
  # inductor rounds intermediates where eager PyTorch does (and fuses no FMAs); on its own the compiled
  # transformer still lands at a median 35.6 dB from the eager path over the 100 protocol prompts (81 of 100 below 40 dB)
  compile_eager_rounding: true
  # op classes kept on the eager kernels inside the compiled forward: with the norms eager the compiled transformer
  # is bit-exact with the eager one (the activations add nothing but graph breaks); every served image is then
  # >= 53 dB from the eager path on all 100 protocol prompts (the compiled VAE) — true: 0.654 s at B=1 vs 0.608 plain; 0.785 without compile; [norms] pending measurement
  compile_exact_ops: [norms]
  cuda_graph: true
  capture_sizes: [[1024, 1024]]
  capture_batch_sizes: [1, 2, 3, 4]
  max_batch_size: 4
  # compiled VAE decode (max-autotune): 3x faster at 1024^2, ~56 dB from the eager decode; the autotuner may pick
  # other conv kernels in another server process (~64 dB apart). vae_compile: false for bit-exact, repeatable output
  vae_compile: true

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
