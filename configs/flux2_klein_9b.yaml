model: "flux2_klein_9b"

# FLUX.2 [klein] 9B (Qwen3-8B text encoder + 4096-wide DiT): same graph and knobs as the
# 4B config. The 9B weights are released under the FLUX Non-Commercial License v2.1,
# not Apache-2.0; check the license before deploying.
max_seq_len: 512

model_kwargs:
  # auto: the DiT's joint attention runs on the engine's ragged attention resource with the platform's default
  # kernel: FlashInfer FA3 on an H100 (served as fast as sdpa, 0.355 vs 0.349 s at B=1), AITER's asm flash attention
  # on MI300X/MI325X (where torch's sdpa is AOTriton, well short of it). sdpa keeps torch's kernel inline, the
  # reference pipeline's, for parity runs. `resources: dit_attn: backend: aiter|flashinfer` pins a kernel.
  attention_backend: auto
  compile: true
  # inductor rounds intermediates where eager PyTorch does (and fuses no FMAs); on its own the compiled
  # transformer still lands at a median 35.6 dB from the eager path over the 100 protocol prompts (81 of 100 below 40 dB)
  compile_eager_rounding: true
  # op classes kept on the eager kernels inside the compiled forward: with the norms eager the compiled transformer
  # is bit-exact with the eager one (the activations add nothing but graph breaks); every served image is then
  # >= 53 dB from the eager path on all 100 protocol prompts (the compiled VAE) — true: 0.654 s at B=1 vs 0.608 plain; 0.785 without compile; [norms] pending measurement
  # On AMD GPUs this is not applied (`knobs: dit_exact_ops`, off there by default): hipBLASLt's per-M kernel choice
  # keeps the output off the reference bit for bit either way. MI325X: 0.709 -> 0.660 s at B=1, 1.54 -> 1.68 images/s at c=16.
  compile_exact_ops: [norms]
  accelerator_graph: true
  # [height, width]: 1024^2 and 1344x768, the two sizes of the image benchmark set; an uncaptured size compiles
  # per batch size inside its first requests and decodes on the eager VAE. Edits keep the one bucket. MI325X: the
  # first 1344x768 request takes 0.4-0.7 s instead of 1.4-1.7 (86 s on a cold server); warm startup 42 -> 48-54 s.
  capture_sizes: [[1024, 1024], [768, 1344]]
  capture_edit_sizes: [[1024, 1024]]
  capture_batch_sizes: [1, 2, 3, 4]
  max_batch_size: 4
  # compiled VAE decode (max-autotune): 3x faster at 1024^2, ~56 dB from the eager decode; the autotuner may pick
  # other conv kernels in another server process (~64 dB apart). vae_compile: false for bit-exact, repeatable output
  vae_compile: true
  # linear_dtype: fp8 runs the DiT blocks' linears as fp8 GEMMs (MI300X/MI325X/MI355X, Hopper+): 1.34x images/s at
  # c=1 and 1.39x at c=16 on MI325X; median 23.1 vs 26.6 dB from diffusers, under the ROCm floor (docs/models.rst)
  # Under linear_dtype: fp8 these stay bf16: the linears with the most image error per ms of fp8 saving on MI325X,
  # about 40% of the saving (ignored under bf16). One-GPU MI325X A/B: median 26.5 dB from diffusers, over the ROCm
  # floor, at ~1.18x bf16 images/s; lists giving back 20-30% fell under the floor (25.2 dB)
  # On AMD GPUs fp8 needs `knobs: dit_exact_ops: true` (top level): the list was picked with the norms eager. MI325X:
  # 26.5 dB with the knob on, 25.4-25.8 with it off. The knob costs 8% of fp8 images/s at c=1, leaving 1.1x bf16
  fp8_keep_bf16:
    - double_blocks.*.attn.*
    - double_blocks.*.img_ff.*
    - single_blocks.0-13.out
    - single_blocks.15-16.out
    - single_blocks.18.out
    - single_blocks.0.qkv_mlp
    - single_blocks.3.qkv_mlp
  # linear_dtype_steps picks the dtype per denoise step (docs/models.rst): with this list, [bf16, bf16, fp8, fp8] loses
  # 0.2 dB on the typical image against bf16 on MI325X, 1.3 dB with fp8 on every step, at about half of the speedup
  # async_scheduling (default true): the worker assembles the next denoise step while the current one runs and merges
  # newly ready requests into it; `false` = lockstep, within a few percent (see docs/models.rst)

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
