model: "flux2_klein_9b"

# FLUX.2 [klein] 9B (Qwen3-8B text encoder + 4096-wide DiT): same graph and knobs as the
# 4B config. The 9B weights are released under the FLUX Non-Commercial License v2.1,
# not Apache-2.0; check the license before deploying.
max_seq_len: 512

model_kwargs:
  # sdpa (cuDNN on H100) is the reference kernel; flashinfer stays available
  attention_backend: sdpa
  compile: true
  # inductor rounds intermediates where eager PyTorch does (and fuses no FMAs); on its own the compiled
  # transformer is still not bit-exact with the eager path (measured PSNR: compile_exact_ops in docs/models.rst)
  compile_eager_rounding: true
  # op classes kept on the eager result inside the compiled forward: with the norms kept the compiled
  # transformer was bit-exact with the eager one (measured while the q/k norms were graph breaks; the
  # activations add nothing but graph breaks), and with vae_compile: false so was every served image
  # (see compile_exact_ops in docs/models.rst)
  compile_exact_ops: [norms]
  accelerator_graph: true
  capture_sizes: [[1024, 1024]]
  # the dit's capture batch sizes (the text encoder captures geometric_batch_sizes: powers of two below
  # max_batch_size, then max_batch_size)
  capture_batch_sizes: [1, 2, 3, 4]
  max_batch_size: 4
  # compiled VAE decode (max-autotune), not bit-exact with the eager decode: before the folded upsample and split
  # GroupNorm it was 3x faster at 1024^2 and ~56 dB from eager, and the autotuner may pick other conv kernels in another
  # server process (~64 dB apart). vae_compile: false for bit-exact, repeatable output
  vae_compile: true
  # async_scheduling (default true): the worker assembles the next denoise step while the current one runs and merges
  # newly ready requests into it; `false` = lockstep, within a few percent (see docs/models.rst)

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_encoder, vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
