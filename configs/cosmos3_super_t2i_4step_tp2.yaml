model: "cosmos3_super_t2i_4step"
# Sequence-length hint for the scheduler (see cosmos3_nano.yaml).
max_seq_len: 8192
# Per-rank KV pool, as for Super at TP=2 (see cosmos3_super_tp2.yaml).
resources:
  kv:
    max_num_pages: 384
model_kwargs:
  accelerator_graph: true
  # Compile the captured text prefill: its eager norms and copies are about a
  # third of its GPU time.
  compile_prefill: true
  # The default 1024x1024 request (latent 64x64); a conditional-only graph,
  # since the distilled checkpoint runs without guidance.
  gen_capture_image: [[1024, 1024]]
  graph_max_latent_area: 4096
  # Distilled: 4 fixed sigmas, guidance baked into the weights. The distilled
  # sampler reads its sigma list from the checkpoint scheduler config.
  num_inference_steps: 4
  guidance_scale: 1.0
node_groups:
  - node_names: ["dit"]
    ranks: [0, 1]
    tp_size: 2
  - node_names: ["vae_encoder", "vae_decoder", "audio_decoder"]
    ranks: [0]
