model: "glm52"
# GLM-5.2 TP8 with the fused fp8 MoE kernel, which is what lets decode
# capture. Numerics differ from the reference dispatch in glm52_tp8.yaml:
# activations quantize to fp8 inside the kernel. Use that config as the
# token-diff anchor and this one for speed.
max_seq_len: 2048
dist_timeout_s: 7200
model_kwargs:
  # checkpoint_path: the snapshot dir, if not resolving through HF_HOME.
  tokenizer_mode: hf
  moe_quant_kernel: triton
resources:
  kv:
    max_num_pages: 512
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
