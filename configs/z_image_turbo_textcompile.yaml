model: "z_image_turbo"

# z_image_turbo.yaml with the compiled caption encoder, on every platform. That file's comments explain the settings and why this is
# not the default: it saves 14.6 ms a request on MI325X and redraws some images. Unmeasured on NVIDIA.
max_seq_len: 512

model_kwargs:
  attention_backend: auto
  compile: true
  compile_eager_rounding: true
  compile_exact_ops: false
  accelerator_graph: true
  capture_sizes: [[1024, 1024], [768, 1344]]
  capture_caption_lengths: [32, 64, 96, 128]
  capture_batch_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  max_batch_size: 8
  vae_compile: true
  text_compile: true

node_groups:
  - node_names: [text_encoder]
    ranks: [0]
  - node_names: [vae_decoder]
    ranks: [0]
  - node_names: [dit]
    ranks: [0]
