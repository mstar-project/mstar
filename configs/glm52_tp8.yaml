model: "glm52"
# GLM-5.2 on 8x H200 (TP8). The fp8 checkpoint is ~750 GB; routed experts stay
# fp8-resident, so weights are ~96 GB/rank. Resolve the checkpoint through the HF cache
# (HF_HOME) or pass model_kwargs.checkpoint_path. docs/models.rst has the overrides for
# greedy workloads (MTP drafting, 26-47% faster) and for long context.
#
# model_kwargs.kernels: auto (the default) serves the tuned kernels, among them the fused
# fp8 MoE that lets decode capture; kernels: reference serves the numerics anchor, eager.
#
# The context is index_topk, 2048 tokens, where dense MLA equals the sparse reference
# exactly; the submodule refuses more.
max_seq_len: 2048
# A 750 GB load outruns PyTorch's default process-group timeout.
dist_timeout_s: 7200
# NVLS multicast; NCCL, with a warning, where that is unavailable
tp_allreduce: "symm_multimem"
# a 2048-token prefill moves 24 MiB, which the 512 KiB default sends to NCCL
tp_allreduce_max_kb: 32768
# The largest captured decode batch: past it the scheduler splits decode into two steps.
max_concurrent_requests: 64
model_kwargs:
  prefill_capture_batch_sizes: [1, 4, 16]
# one request's prefill captures every 64 tokens to 2048 (a 1024-token chat
# prompt is ~1100), a batch's coarser to 4096; longer prefills are GPU-bound
# and run compiled
prefill_token_buckets:
  LLM:
    prefill:
      1: [64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768,
          832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1472, 1536,
          1600, 1664, 1728, 1792, 1856, 1920, 1984, 2048]
      2: [256, 512, 1024, 1536, 2048, 2304, 2560, 3072, 3584, 4096]
resources:
  kv:
    # pages = requests x pages a request holds + the sink: 64 x 2048 / 128 + 1. 78 latent
    # planes of 576 bf16 = 90 KB/token, ~11.8 GB/rank. (Under TP the prefix cache is off,
    # so more pages hold nothing.)
    max_num_pages: 1025
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
