model: "glm52"
# GLM-5.2 on 8 GPUs of 141 GB. The fp8 checkpoint is ~750 GB; routed experts
# stay fp8-resident, so weights are ~96 GB/rank at TP8. Resolve the
# checkpoint through the HF cache (HF_HOME) or pass
# model_kwargs.checkpoint_path.
#
# The fp8 linears stay fp8, and the model serves its tuned kernels (kernels: auto):
# the fused fp8 MoE, which is what lets decode capture, its decode and router
# kernels, the MLA latent prep in two kernels, each all-reduce up to 1 MiB fused
# with the next add + RMSNorm, and the last layer's FFN on the sampled rows at
# prefill. model_kwargs.kernels: reference serves the numerics anchor instead,
# eager. tp_async_sched builds decode step N+1 while step N runs
# (MSTAR_TP_ASYNC_SCHED overrides).
#
# Without dsa_long_context the context is capped at index_topk (2048), where
# dense MLA equals the sparse reference exactly; the submodule refuses more.
# See glm52_tp8_longctx.yaml to serve beyond it.
max_seq_len: 2048
# A 750 GB load outruns PyTorch's default process-group timeout.
dist_timeout_s: 7200
# NVLS multicast all-reduce, one-shot up to 32 KiB; stays on NCCL, with a
# warning, where NVLink multicast is unavailable.
tp_allreduce: "symm_multimem"
# a 2048-token prefill moves 24 MiB, which the 512 KiB default sends to NCCL
tp_allreduce_max_kb: 32768
tp_async_sched: true
# A request holds at most 16 pages (17 with MTP's verify rows): 64 of them
# fit the pool below, so a decode step never finds it empty.
max_concurrent_requests: 64
model_kwargs:
  # prefill graphs every 64 tokens to 2048 for one request (a 1024-token chat
  # prompt is ~1100 tokens), coarser for batches to 4096; longer prefills run
  # the compiled forward, where the GPU is the bound
  prefill_token_buckets: [
    64, 128, 192, 256, 320, 384, 448, 512, 576, 640, 704, 768,
    832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344, 1408, 1472, 1536,
    1600, 1664, 1728, 1792, 1856, 1920, 1984, 2048]
  prefill_batched_token_buckets: [256, 512, 1024, 1536, 2048, 2304, 2560, 3072, 3584, 4096]
  prefill_capture_batch_sizes: [1, 4, 16]
resources:
  kv:
    # MLA latent pages: 576 dims x bf16 = 1.15 KB/token/layer, ~90 KB/token
    # across 78 layers. 1536 x 128-token pages = 196k tokens, ~17.7 GB/rank.
    max_num_pages: 1536
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
