model: "glm52"
# GLM-5.2 TP8 serving config for an 8xH200 node (~750 GB FP8 checkpoint;
# routed experts stay fp8-resident, ~96 GB weights/rank). Resolve the
# checkpoint through the shared HF cache: launch with HF_HOME set (see the
# coriander recipe) or pass model_kwargs.checkpoint_path to a snapshot dir.
# Phase B serves ctx <= 2048 only: without the DSA indexer (Phase C), dense
# MLA matches the reference computation exactly within the top-2048 window
# and diverges beyond it — the submodule refuses longer contexts.
max_seq_len: 2048
# A 750 GB fp8 load + dense dequant outruns PyTorch's default process-group
# timeout, same failure mode as Kimi's 1 TB INT4 load.
dist_timeout_s: 7200
kv_cache:
  # MLA latent pages: 576 dims x bf16 = 1.15 KB/token/layer (~90 KB/token
  # across 78 layers); 512 x 128-token pages = 64k cached tokens/rank,
  # i.e. 32 concurrent full-length (2048) requests.
  max_num_pages: 512
  page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
