model: "minimax_h3_image"

# See minimax_h3_image.yaml.
max_seq_len: 8192

# MiniMax-H3-Image on 2 GPUs for latency: the DiT (66 GB) Ulysses sequence-parallel over both,
# each rank holding the whole DiT and half of the packed rows; the conditioner and the VAE on
# rank 1 (~115 GiB in use there once loaded, so 141 GB GPUs).
model_kwargs:
  attention_backend: flashinfer
  compile: true
  vae_tile_batch: 64

node_groups:
  - node_names: [dit]
    ranks: [0, 1]
    sp_size: 2
  - node_names: [text_encoder, vae_encoder, vae_decoder]
    ranks: [1]
