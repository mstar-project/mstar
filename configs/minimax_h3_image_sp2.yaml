model: "minimax_h3_image"

# See minimax_h3_image.yaml.
max_seq_len: 8192

# MiniMax-H3-Image on 2 GPUs for latency: the DiT (66 GB) Ulysses sequence-parallel over both,
# each rank holding the whole DiT and half of the packed rows, and the decoder in the same SP
# group, each rank decoding half of the tiles between denoise steps; the conditioner and the VAE
# encoder on rank 1 (~120 GiB in use there once loaded, so 141 GB GPUs).
model_kwargs:
  compile: true
  vae_tile_batch: 64
  # the last 16 prompts' text rows, as SGLang's conditioning cache: a repeated prompt (and
  # references) skips the text encoder and gets the same image
  text_cache_entries: 16
  # the decoder's blocks compiled per tile batch (56-58 dB from eager; -0.13 s at 2048² on 2 H200s)
  vae_compile: true
  # a 1024² step replays a CUDA graph (one per 256 prompt rows up to 512): eager, its ~3,400
  # launches took longer to issue than the two GPUs took to run them
  capture_sizes: [[1024, 1024]]

node_groups:
  - node_names: [dit, vae_decoder]
    ranks: [0, 1]
    sp_size: 2
  - node_names: [text_encoder, vae_encoder]
    ranks: [1]
