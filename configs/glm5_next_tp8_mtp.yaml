model: "glm5_next"
# glm5_next_tp8.yaml with MTP speculative decoding, k=3; its comments cover the
# keys the two share.
max_seq_len: 2048
max_concurrent_requests: 64
tp_allreduce: "flashinfer"
tp_allreduce_max_kb: 32768
tp_async_sched: true
model_kwargs:
  moe_quant_kernel: "auto"
  # drafts per step from the layer-45 MTP module; a request with a temperature
  # > 0 or a repetition penalty is refused
  mtp_num_draft_tokens: 3
  prefill_graphs: true
resources:
  kv_cache:
    # The 11 MLA layers and the MTP layer are paged, a 576-wide latent each (512
    # + the rope slot that masks rejected drafts): ~13.8 KB/token. Every verify
    # step keeps its rejected drafts, so a request holds up to 2048 x 4 = 8192
    # rows; 4096 pages x 128 hold one per KDA slot, plus the sink page: ~7.2 GB/rank.
    max_num_pages: 4097
    page_size: 128
  kda_state:
    # as in glm5_next_tp8.yaml, at ~22 MB/slot/rank with the last verify block's inputs
    max_slots: 65
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
