model: "glm52"
# GLM-5.2 TP8 with MTP speculative decoding and the fused fp8 MoE kernel.
# This is the captured MTP path: the trunk verify and the draft chain replay
# as piecewise graphs, prefill and the sync pass stay eager. Numerics differ
# from the reference dispatch in glm52_tp8_mtp.yaml, which is the token-diff
# anchor.
max_seq_len: 2048
dist_timeout_s: 7200
model_kwargs:
  # checkpoint_path: the snapshot dir, if not resolving through HF_HOME.
  tokenizer_mode: hf
  moe_quant_kernel: triton
  # Drafts per step. k=3 was the best of k=2..4 on an 8xH200 node; re-sweep
  # on other hardware.
  mtp_num_draft_tokens: 3
resources:
  kv:
    max_num_pages: 512
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
