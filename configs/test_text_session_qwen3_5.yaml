# Qwen3.5's LLM, text only, with its KV cache and its GDN recurrent state held
# across a persistent session. See docs/sessions.rst.
model: "test_text_session_qwen3_5"
max_seq_len: 32768
max_concurrent_requests: 8

# 4B by default (the registry's); uncomment for 9B.
# model_kwargs:
#   model_path_hf: Qwen/Qwen3.5-9B

resources:
  gdn_state:
    # A parked session holds its slot out of circulation (there is no host
    # offload for recurrent state), so the pool covers every session's slot
    # plus one per running request, with room to spare: 4 + 8 + the sink.
    max_slots: 33

sessions:
  max_concurrent_sessions: 4
  default_timeout_s: 300.0
  max_timeout_s: 1800.0
  ttl_mode: idle
  resources:
    kv_cache:
      # pages (128 tokens each), so ~8k tokens of conversation per session
      max_state: 64
    gdn_state:
      # slots: one per label, and a text turn runs only `main`
      max_state: 1

node_groups:
  - node_names:
      - LLM
    ranks:
      - 0
