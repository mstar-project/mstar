model: "pi05"
max_seq_len: 2048

# pi0.5 fine-tuned on DROID (openpi's pi05_droid, ported by lerobot), served like
# openpi's pi05_droid policy (openpi/src/openpi/training/config.py, droid_policy.py).
#
# A request carries two images, exterior_image_1_left then wrist_image_left (openpi
# masks out the third camera slot for DROID), the task, and robot_state = the raw 7
# joint positions plus the gripper position. The reply is [15, 32]: the first 8 dims
# are joint velocities and the gripper position in robot units (openpi keeps [:, :8]),
# the rest is padding. action_dim stays 32, the checkpoint's projection width.
#
# These are fixed at server start, and action_horizon and num_cameras are baked into
# the CUDA-graph captures.
model_kwargs:
  model_path_hf: "lerobot/pi05_droid"
  action_horizon: 15
  num_cameras: 2
  # openpi's DROID stats, gs://openpi-assets/checkpoints/pi05_droid/assets/droid/norm_stats.json
  # (its first 8 dims, the rest is zero padding). Neither lerobot checkpoint ships them.
  norm_stats:
    state:
      q01: [-0.8279732212066653, -0.8398311847686768, -0.8425482082366944, -2.773015278291702,
            -1.8426181347846986, 1.1716566389799117, -2.047264838027954, 0.0]
      q99: [0.8996522880554196, 1.385467470359802, 0.6920277433395388, -0.4542043057203293,
            1.732314240932464, 3.4672964780330657, 2.1984972072601314, 0.991]
    actions:
      q01: [-0.45799999999999996, -0.8076, -0.44719999999999993, -0.9268, -0.6456, -0.6459999999999999,
            -0.7616, 0.0]
      q99: [0.4476, 0.7652000000000001, 0.4480000000000002, 0.7944, 0.6484000000000001, 0.6628000000000001,
            0.7344000000000002, 0.9998]

node_groups:
  - node_names:
      - vit_encoder
    ranks:
      - 0

  - node_names:
      - LLM
    ranks:
      - 0
