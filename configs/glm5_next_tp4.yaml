model: "glm5_next"
# GLM-5.3-Flash on 4x H200 (TP4): ~76 GB/rank of weights. glm5_next_tp8.yaml on half the
# GPUs, and its comments cover the keys the two share; only the KDA state per slot doubles.
max_seq_len: 2048
max_concurrent_requests: 64
tp_allreduce: "flashinfer"
tp_allreduce_max_kb: 32768
model_kwargs:
  moe_quant_kernel: "auto"
  prefill_graphs: true
prefill_token_buckets:
  LLM:
    prefill: [
      128, 256, 384, 512, 640, 768, 896,
      1024, 1088, 1152, 1216, 1280, 1344, 1408, 1472, 1536, 1600, 1664, 1728, 1792, 1856, 1920, 1984, 2048,
      2304, 2560, 2816, 3072, 3328, 3584, 3840, 4096, 4352, 4608, 4864, 5120, 5376, 5632, 5888, 6144,
      6400, 6656, 6912, 7168, 7424, 7680, 7936, 8192]
resources:
  kv_cache:
    # 64 x 2048 / 128 + 1, as in glm5_next_tp8.yaml: ~1.5 GB/rank
    max_num_pages: 1025
    page_size: 128
  kda_state:
    # ~37 MB/slot/rank at TP4: ~2.4 GB/rank
    max_slots: 65
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3]
    tp_size: 4
    graph_walks: [prefill, decode]
