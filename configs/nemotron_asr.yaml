model: "nemotron_asr"
max_seq_len: 8192
# A request holds one decoder state slot from its first decode iteration to its
# last; the pool holds max_concurrent_requests of them plus its sink slot, and
# the conductor queues the rest.
max_concurrent_requests: 128
resources:
  transducer_state:
    max_slots: 129
node_groups:
  - node_names: [audio_encoder, transducer]
    ranks: [0]
# Constructor options (forwarded to ParakeetModel.__init__):
# model_kwargs:
#   lookahead: 13  # right attention context in 80 ms frames: 0, 3, 6 or 13;
#                  # wider is more accurate, and the widest is the default
#   compile_step: false  # decode with eager kernels: start-up a few seconds faster, decoding ~2.5x slower
