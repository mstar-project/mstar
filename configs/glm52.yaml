# GLM-5.2 — single-rank bring-up config (dummy mode / small-scale dev).
# The real checkpoint is ~750 GB FP8: production serving is TP=8 on an
# 8xH200 node (a glm52_tp8.yaml with tp_size: 8 lands with the components).
model: "glm52"
# NOTE: this top-level key is presence-checked only; the model's serving
# ceiling stays Glm52ModelConfig.max_seq_len (2048), and without
# dsa_long_context the hard limit is index_topk = 2048 regardless (the
# preprocess guard refuses beyond it). To serve longer, set
# model_kwargs.max_seq_len AND dsa_long_context — see glm52_tp8_longctx.yaml.
max_seq_len: 2048
node_groups:
  - node_names: [LLM]
    ranks: [0]
    graph_walks: [prefill, decode]
