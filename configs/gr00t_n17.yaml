model: "gr00t_n17"

# No node keeps a KV cache (every attention is cacheless and ragged), so
# `max_seq_len` only satisfies the conductor's config check. DROID's two cameras
# at two timesteps are 448 image rows, plus the instruction's text rows.
max_seq_len: 1024

# Single GPU: all five nodes on rank 0. The grouping is by walk, for readability,
# which is all grouping does until nodes sit on different ranks.
node_groups:
  # `prefill`'s conditioning branch: ViT → 16 LLM layers → the VL bridge
  - node_names: [vision_encoder, LLM, vl_bridge]
    ranks: [0]
  # `prefill`'s other branch, independent of it
  - node_names: [state_encoder]
    ranks: [0]
  # `action_gen`: the four-step denoise loop
  - node_names: [denoise_step]
    ranks: [0]

model_kwargs:
  # CUDA graphs for the denoise step, the node that runs four times per request.
  # One graph per [text_rows, image_rows] bucket per batch size; a shape with no
  # graph runs eager, and a batch of 3, 5, 6 or 7 replays the next captured size.
  # DROID's demo instructions give 13 text rows (no instruction), 21 and 25; a
  # deployment captures its own prompts' lengths.
  # Graph mode holds one FlashInfer workspace per attention label per slot (the
  # denoise step alone: 3 labels x 2 slots), at MSTAR_WORKSPACE_BUFFER_MB each,
  # 512 by default. On a 12-16 GB card set it to 128, or the card fills before
  # the first request.
  accelerator_graph: true
  capture_shapes: [[13, 448], [21, 448], [25, 448]]
  capture_batch_sizes: [1, 2, 4, 8]

resources:
  # A captured DT step's cross-attention wrapper is sized per request: by default
  # the bucket's own 41 query tokens, but its keys are a request's text or image
  # rows. 448 covers the widest span of the capture_shapes above.
  dt_xattn:
    max_tokens_per_request: 448
