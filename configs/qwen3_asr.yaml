model: "qwen3_asr"
max_seq_len: 65536
# Requests past the cap queue in the conductor instead of fighting for pages.
# A 20 min file takes about 122 pages of 128 tokens, so 2048 pages let 16 of
# them decode at once and short utterances are never the limit.
max_concurrent_requests: 64
resources:
  kv_cache:
    max_num_pages: 2048
    cpu_offload_pages: 256
node_groups:
  - node_names: [audio_encoder, LLM]
    ranks: [0]
