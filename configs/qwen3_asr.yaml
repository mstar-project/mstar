model: "qwen3_asr"
max_seq_len: 65536
# Requests past the cap queue in the conductor. A 20 min file holds about 122
# pages of 128 tokens for its prompt and up to 32 for its transcript, so 2048
# pages decode about 13 of them at once (see docs/asr.rst for more); short
# utterances are never the limit.
max_concurrent_requests: 64
resources:
  kv_cache:
    max_num_pages: 2048
    cpu_offload_pages: 256
node_groups:
  - node_names: [audio_encoder, LLM]
    ranks: [0]
