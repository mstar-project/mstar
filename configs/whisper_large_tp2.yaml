model: "whisper_large"
max_seq_len: 448
# The decoder caches are sized for 64 requests at once (12 cross-attention
# pages and 4 self-attention pages each). More than that would stall.
max_concurrent_requests: 64
resources:
  kv_cache:
    cpu_offload_pages: 4096
  cross_kv_cache:
    cpu_offload_pages: 4096
node_groups:
  - node_names: [audio_encoder]
    ranks: [0]
  - node_names: [decoder]
    ranks: [0, 1]
    tp_size: 2
