# configs/omnivoice.yaml with code2wav on its own worker. Both workers run on
# GPU 0 (rank_devices), so the backbone's unmask loop no longer stops for each
# finished request's codec decode (the output shaping runs on the API side
# either way). `mps: true` runs both as clients of one MPS daemon so their
# kernels overlap rather than time-slice.
model: "omnivoice"
max_seq_len: 8192
node_groups:
  - node_names: [ref_encoder, backbone]
    ranks: [0]
  - node_names: [code2wav]
    ranks: [1]
rank_devices: {1: 0}
mps: true
# Two workers share the GPU; each plans its captures within its share.
gpu_memory_fraction: 0.45
