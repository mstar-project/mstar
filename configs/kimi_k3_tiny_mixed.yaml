# Tiny fp32 Kimi K3 on one GPU with decoding requests riding along in prefill steps
# (model_kwargs.mixed_prefill_decode); see configs/kimi_k3_tiny_mixed_tp2.yaml.
model: "kimi_k3"
max_seq_len: 4096
model_kwargs:
  checkpoint_dir: /scratch/m000137-pm06/atj10/kimi_k3_mstar/ref/tiny_kimi_k3
  max_output_tokens: 256
  mixed_prefill_decode: true
node_groups:
  - node_names: [LLM]
    ranks: [0]
    tp_size: 1
    graph_walks: [prefill, decode]
resources:
  mla_kv:
    max_num_pages: 512
    page_size: 64
  kda_state:
    max_num_slots: 128
