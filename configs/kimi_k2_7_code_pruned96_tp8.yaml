model: "kimi_k2_7"
# TP8 text-only config for the 96-expert pruned Kimi-K2.7-Code checkpoint
# (test/integration/kimi_prune_experts.py --keep 96). n_routed_experts is read
# from the checkpoint's config.json, so the same code serves the full model.
#   mstar-serve --config configs/kimi_k2_7_code_pruned96_tp8.yaml \
#               --model-path /path/to/kimi_k2_7_code_pruned96
max_seq_len: 262144
dist_timeout_s: 7200
# Decode-path defaults, measured on the pruned-96 checkpoint at TP4 on 4x H200; same switches at TP8
# (8k in / 1k out, TPOT p50 at N=1 / N=8): 14.4 / 24.0 ms with none of these,
# 9.4 / 14.9 ms with all of them. Set any of them in the environment to override.
env:
  MSTAR_ALLREDUCE_BACKEND: flashinfer            # one-shot all-reduce fused with add+RMSNorm
  MSTAR_TP_ASYNC_SCHED: "1"                      # build/plan step N+1 during forward N
  TORCHINDUCTOR_MAX_AUTOTUNE_GEMM_BACKENDS: ATEN # cuBLAS for small-M decode GEMMs
  MSTAR_KIMI_SHARED_STREAM: "1"                  # shared expert beside the routed experts
  MSTAR_MLA_DECODE_BACKEND: fa3                  # FA3 MLA decode (falls back to FlashInfer)
model_kwargs:
  config_variant: k27_code
  tokenizer_mode: hf
  # Text-only, matching vLLM's --language-model-only: no MoonViT tower, no
  # prefill_vision walk.
  vision: false
resources:
  kv_cache:
    # Absorbed MLA latent, replicated on every TP rank: 9.0 MB per 128-token
    # page over 61 layers. 3072 pages = 27.6 GB per rank = 393k tokens: one
    # 262k request plus headroom, and above 32 x 9216 for the benchmark sweep.
    max_num_pages: 3072
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
