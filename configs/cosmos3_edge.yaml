model: "cosmos3_edge"
# Sequence-length hint for the scheduler. The conductor only asserts its
# presence; the real per-request capacity is the KV pool below.
max_seq_len: 8192
# KV pool sizing. Edge is 28 layers x 8 KV heads x 128 (half of Nano's per-page
# footprint); one pool serves both the DiT's frozen text prefixes (a few pages
# per guidance branch) and the reasoner's chat context (up to 131k tokens per
# request). 1024 pages x 128 tokens is ~7.5 GB in bf16.
resources:
  kv:
    max_num_pages: 1024
model_kwargs:
  # Graph capture settings: accelerator_graph=false runs all steps eagerly.
  # graph_max_latent_area caps which resolutions are captured (latent H*W).
  # COSMOS3_DISABLE_ACCELERATOR_GRAPH disables capture;
  # COSMOS3_GRAPH_MAX_LATENT_AREA overrides the area cap.
  accelerator_graph: true
  graph_max_latent_area: 2000
  # Video denoise steps stay eager on the dense FA3 path: capturing them
  # (gen_capture_video) forces the paged attention into the graph, which
  # measured 3-6% slower at 832x480 for both the 121-frame clip and the
  # 29-frame window (H100, 2026-09-17). Add tiers here only for small,
  # launch-bound shapes.
  gen_capture_video: []
  # Edge is 480p-native: the model card's generator recipe is 832x480 video
  # (121 frames, 24 fps, 20 UniPC steps, guidance 6.0, flow shift 12.0 on the
  # native flow schedule) and 640x640 images. Requests override any of these.
  image_size_default: [640, 640]
  video_size_default: [832, 480]
  num_frames_video: 121
  num_inference_steps_video: 20
  guidance_scale: 6.0
  flow_shift_video: 12.0
  # Image-to-video conditioning follows the model card's diffusers recipe:
  # cover-scale, antialiased resize, center crop, 8-bit rounding.
  conditioning_resize: aspect_crop
  # Action requests (forward/inverse dynamics, policy) follow the Edge model
  # card: 30 steps, guidance 1.0, flow shift 10.0.
  num_inference_steps_action: 30
  guidance_scale_action: 1.0
  flow_shift_action: 10.0
  # Streaming rollout: windowed autoregressive video (the video_gen_ar walk,
  # the vae_decoder_ar node and its streaming decoder partition). Requests opt
  # in per call with window_mode ("chained" | "kv") or stream_video alone
  # (chained). Edge's chained windows default to 61 frames re-pinning 32
  # (window_frames_default / overlap_frames_default). kv is experimental: it
  # leaves the conditioning image within a few windows on this checkpoint.
  enable_windowed_video: true
  # The streaming decoder keeps each live stream's VAE conv cache (1.33 GiB
  # of tensors per stream at 832x480 in bf16; it grows with the frame area and
  # doubles in fp32). Uncomment to cap the warm streams per decoder copy;
  # streams past the cap take the stateless context re-decode.
  # windowed_decode_max_warm_streams: 0   # 0: no cap
  # Latents per decoder call in the streaming decode (default 1). 0 decodes a
  # steady window's new latents in one call: the decoder alone is ~6% faster at
  # 832x480, but served end to end it is no faster and takes about 15 GiB more
  # peak (832x480 bf16, measured on B200).
  # windowed_decode_latents_per_call: 1
node_groups:
  # The DiT and the reasoner share one transformer instance and one KV pool;
  # they must sit in the same group. The vision encoder feeds the reasoner's
  # prefill, the VAE nodes the generator walks.
  - node_names: ["dit", "reasoner"]
    ranks: [0]
  - node_names: ["vision_encoder", "vae_encoder", "vae_decoder", "vae_decoder_ar"]
    ranks: [0]
# Requests the server runs after the workers are ready and before it binds,
# so no client pays a shape's first torch.compile of the denoise step (15-25 s
# to the first frame on a fresh server against 1.9 s warm). One per default
# video shape: the 121-frame clip and the 61-frame chained window (93 frames is
# two windows) and an image-conditioned rollout (the conditioning encode and
# the i2v prefill are their own first-time cost). The compile keys on shapes,
# not steps, so four steps do. Startup grows by their wall time. The
# experimental kv mode is not warmed: its first request pays the 29-frame
# window's compile.
warmup_requests:
  - text: warmup
    output_modalities: [video]
    model_kwargs: {num_frames: 121, num_inference_steps: 4}
  - text: warmup
    files: [hf://nvidia/Cosmos3-Edge/assets/example_i2v_input.jpg]
    output_modalities: [video]
    model_kwargs: {window_mode: chained, num_frames: 93, num_inference_steps: 4}
