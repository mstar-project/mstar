model: "glm52"
# GLM-5.2 TP8 with MTP speculative decoding, reference MoE numerics.
#
# mtp_num_draft_tokens=k loads the layer-78 draft module (~9.7B extra
# params) and makes each decode step draft-then-verify: the target forwards
# k+1 tokens per request, emits accepted+1 (greedy prefix match, so the
# stream stays bit-identical to k=0 at temperature 0), rewinds the rejected
# KV tail in place, and the draft module proposes the next k. KV grows by
# one layer plane, the draft module's own cache sharing the trunk's page
# table.
#
# Limits: greedy only (requests asking for temperature > 0 or a repetition
# penalty are refused per request), and short context, since MTP and
# dsa_long_context are mutually exclusive.
#
# This config sets no moe_quant_kernel, so the MoE resolves to the reference
# dispatch, whose host loops cannot be captured; no piecewise graphs are
# registered and the MTP step runs eager end to end. That is far slower than
# captured decode. Use it as the reference-numerics anchor and
# glm52_tp8_mtp_fast.yaml to serve.
max_seq_len: 2048
dist_timeout_s: 7200
model_kwargs:
  mtp_num_draft_tokens: 2
resources:
  kv:
    # One extra layer plane vs glm52_tp8.yaml, 79 in all. Page 0 is reserved
    # as the padded-replay scatter target, leaving 511 usable pages.
    max_num_pages: 512
    page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
