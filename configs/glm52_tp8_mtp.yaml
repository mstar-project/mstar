model: "glm52"
# GLM-5.2 TP8 with MTP speculation (M3, opt-in). Same box shape as
# glm52_tp8.yaml; the difference is model_kwargs.mtp_num_draft_tokens.
#
# mtp_num_draft_tokens=k loads the layer-78 draft module (~9.7B extra
# params, fp8-resident experts like the trunk) and turns each decode step
# into draft-then-verify: the target forwards k+1 tokens per request,
# emits accepted+1 (greedy prefix-match — the stream stays bit-identical
# to k=0 at temp 0), rewinds the rejected KV tail in place, and the MTP
# module drafts the next k. KV grows by ONE layer plane (the draft
# module's own cache, sharing the trunk's page table): 79 planes at
# 1.15 KB/token/layer.
#
# v1 limits: greedy-only (drafts and verification bypass the sampler —
# requests asking for temperature>0 or a repetition penalty are refused
# per-request); short-context only (mutually exclusive with
# dsa_long_context).
#
# CAPTURE: this config serves the MTP step EAGER end to end. It sets no
# moe_quant_kernel, so the MoE resolves to the reference dispatch, whose
# host loops are uncapturable — _moe_capture_blocked() then registers NO
# piecewise graphs (mtp_trunk/mtp_draft need the fused kernel). That is
# the measured-13x-slow regime; this config exists as the token-diff
# anchor (reference numerics), not for speed. For captured MTP serving
# use glm52_tp8_mtp_fast.yaml (moe_quant_kernel: triton), where the
# trunk verify and the draft-chain iteration replay piecewise and only
# prefill + the sync pass stay eager.
# k=2 is the measured optimum on the 2026-08-09/10 sweep (49.65 tok/s vs
# 47.95 at k=1, 47.99 at k=3; k=5 eager was 32.30, BELOW the k=0
# baseline). vLLM's k=3-5 recipe assumes its ~1 ms chain iteration; ours
# is ~2.4 ms captured. Re-sweep after the sync-pass capture and the
# trunk-pairing A/B land — both move the optimum upward.
max_seq_len: 2048
dist_timeout_s: 7200
model_kwargs:
  mtp_num_draft_tokens: 2
kv_cache:
  # One extra layer plane vs glm52_tp8.yaml (79 total): ~91 KB/token
  # across planes. 512 pages x 128 tokens, minus page 0 (reserved as the
  # padded-replay scatter target) = 511 usable pages, ~65k cached
  # tokens/rank.
  max_num_pages: 512
  page_size: 128
node_groups:
  - node_names: [LLM]
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    tp_size: 8
    graph_walks: [prefill, decode]
