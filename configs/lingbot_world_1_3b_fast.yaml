model: "lingbot_world_1_3b"

# lingbot_world_1_3b.yaml with the DiT blocks compiled at the -O level's
# options (autotuned kernels) instead of Inductor's deterministic defaults:
# 35.4 -> 37.1 fps at 480x832 on a B300 with -O2. Each server process picks
# its own kernels, so the same seed gives a different rollout per process
# (chunks 0-1 land 40.7-41.8 dB from the reference's, 42.1 for the default).
# A cold Inductor cache adds ~80 s of autotuning at load.
model_kwargs:
  dit_compile_autotune: true

# max_seq_len only satisfies the conductor's config check and matches the UMT5
# text length; the dit's K/V and encoder cache live in its request pool (below).
max_seq_len: 512

# One rollout at a time; the model refuses any other value. Each rollout's VAE
# decoder cache lives outside the request pool below, so this is its only bound
# until it is an engine resource.
max_concurrent_requests: 1

# The dit's request pool, reserved at startup, holds each rollout's rolling K/V,
# text K/V and VAE encoder cache. The default, 16.0 GiB, holds one rollout at the
# largest size (720x1280); one at the default size (464x832) takes 6.8 GiB. To
# change it, set
#   resources:
#     dit_pool:
#       pool_bytes: 17179869184   # 16 GiB

# Single-GPU colocated; the Wan VAE encode and decode are fused into the dit forward.
node_groups:
  - node_names: [text_encoder, dit]
    ranks: [0]
