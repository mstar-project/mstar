# VoxCPM2 (openbmb/VoxCPM2): multilingual TTS at 48 kHz, voice design and cloning.
# Talker (MiniCPM-4 base + residual LMs and the local DiT) and the RefEncoder
# (AudioVAE encoder, cloning only) share a GPU with the streaming VAEDecoder.
# The two LMs' KV (28 + 8 layers, 2 KV heads, head_dim 128) is about 36 KB per
# position. A request holds at most max_seq_len positions (64 pages of 128),
# so each LM's cache defaults to 32 such requests and the sink page: 2049
# pages, about 9.7 GB for both. A full cache would stall decode, so startup
# checks max_concurrent_requests against resources.{base_kv,res_kv}.max_num_pages;
# lower or raise the two together. The conductor queues requests past the cap.
model: "voxcpm2"
max_seq_len: 8192
max_concurrent_requests: 32
node_groups:
  - node_names: [RefEncoder, Talker]
    ranks: [0]
    graph_walks: [talker_prefill, talker_prefill_clone, talker_decode]
  - node_names: [VAEDecoder]
    ranks: [0]
    graph_walks: [vae_chunk]
# Constructor options (forwarded to VoxCPM2Model.__init__):
# model_kwargs:
#   compile_talker: false   # capture the eager decode step: up in seconds instead of 10-30 min cold, 15-30% less throughput
#   max_text_tokens: 1365   # longest text per request (default max_len / 3); longer text gets a 400
