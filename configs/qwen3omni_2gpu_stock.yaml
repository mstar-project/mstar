model: "qwen3_omni"
max_seq_len: 32768
# Talker and Code2Wav on one worker on every platform: qwen3omni_2gpu.yaml
# without its AMD override.
resources:
  thinker_kv:
    max_num_pages: 1024
    cpu_offload_pages: 1024
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [1]
  - node_names: [Thinker]
    ranks: [1]
  - node_names: [Talker]
    ranks: [0]
  - node_names: [Code2Wav]
    ranks: [0]
