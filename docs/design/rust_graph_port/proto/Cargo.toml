[package]
name = "mstar-graph-proto"
version = "0.0.1"
edition = "2021"

[lib]
name = "mstar_graph_proto"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
