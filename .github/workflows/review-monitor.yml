name: Review bot monitor

# A daily report on the PRs the review bot approved, and the spend it has used. Reviews
# nothing and runs no model: every step reads GitHub and git and writes the status issue
# (bot.py, monitor). Run it by hand once as setup: it creates the status issue, and the
# first run that spends creates the ledger issue. The status issue's body has one writer:
# this job, serialized by its concurrency group.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency: review-monitor

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The status issue: its body, the alert comments, and the ledger's comments.
      issues: write
      pull-requests: read
      # A failed check on a merge commit whose parent passed.
      checks: read
    steps:
      # Main's history, for reverts and blame; blobs on demand, so it stays light.
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No ref: a scheduled run's event has no repository, and it checks out the default branch.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Report on the status issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPROVALS: ${{ vars.REVIEW_APPROVALS }}
        run: python3 .github/review/bot.py monitor
