name: Publish to PyPI

# Publishes the mstar-ai distribution and the alias packages under
# packaging/aliases/ when a GitHub Release is published. Uses PyPI Trusted
# Publishing (OIDC), so no API token or secret is needed. Each of the three
# projects needs its own pending publisher on PyPI before its first upload
# (project mstar-ai, mstar-project or mstar-serve, owner mstar-project, repo
# mstar, workflow release.yml, environment pypi).
#
# Every publish step mints its own token and PyPI activates one pending
# publisher per token, so on the very first release a later step can fail as
# not authorized. Uploads skip files that already exist, so re-running the
# failed job finishes the release.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag and the alias packages match the version
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml)
          tag="${GITHUB_REF_NAME#v}"
          [ "$v" = "version = \"$tag\"" ] || { echo "tag $GITHUB_REF_NAME does not match pyproject.toml ($v)"; exit 1; }
          for f in packaging/aliases/*/pyproject.toml; do
            grep -q -x -F "$v" "$f" || { echo "$f does not carry $v"; exit 1; }
          done
      - run: pip install build
      - name: Build mstar-ai
        run: python -m build
      - name: Build the alias packages
        run: |
          for alias in packaging/aliases/*/; do
            python -m build --outdir "dist-$(basename "$alias")" "$alias"
          done
      - name: Publish mstar-ai
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Publish mstar-project
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-mstar-project
          skip-existing: true
      - name: Publish mstar-serve
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-mstar-serve
          skip-existing: true
