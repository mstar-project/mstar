name: CI
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        # Use GitHub’s annotation format so lint errors show inline
        run: ruff check --output-format=github .
  # Vendored Rust transport (rust/): cargo tests, then the pyzmq interop
  # pytest against a freshly built extension.
  rust-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - name: Cargo tests (transport + arena semantics)
        working-directory: rust
        run: cargo test --release
      - name: Build the Rust frontend (mstar-server)
        working-directory: rust/server
        run: cargo build --release
      - name: Build and install the extension
        working-directory: rust
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release
          pip install target/wheels/*.whl
      - name: Interop tests (transport + arena + frontend)
        run: |
          pip install pytest pyzmq msgpack numpy
          # cpu torch + triton: the arena test imports the tensor-transport
          # stack, which reaches mstar.utils.sampling (triton at module level)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton
          # the package itself, without its remaining (heavy) deps
          pip install --no-deps -e .
          pytest test/rust/ -v

  # M*-Sim: the simulator's own unit tests plus a no-GPU smoke of the
  # deployment loader. These are CPU-only by construction — the point of the
  # sim package is that it analyzes a deployment without GPUs or weights — so
  # they belong in the normal PR gate rather than a GPU tier.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pyyaml
          # cpu torch + triton: mstar.sim imports reach mstar.utils.sampling,
          # which pulls triton at module level.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton
          pip install --no-deps -e .
      - name: Sim unit tests
        run: pytest test/modular/test_sim_stepdb.py test/modular/test_sim_harvest.py \
               test/modular/test_sim_des.py test/modular/test_sim_hollow.py \
               test/modular/test_sim_walks.py -v
