name: CI
on:
  pull_request:
    branches: [main]
  # Every merge is tested on main too: PRs that are each green alone can still
  # break main when they land together.
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        # Use GitHub’s annotation format so lint errors show inline
        run: ruff check --output-format=github .
      - name: Test the optional Mac runner
        run: python -m unittest discover -s test/ci -v
  # Runs every test directory in CPU_TEST_PATHS (scripts/ci/select_cpu_tests.py)
  # with no list of files to maintain: modules that need a GPU, weights or an
  # optional package skip themselves; see CONTRIBUTING.md. test/ci checks that
  # every other test module is excluded there with a reason. scripts/ci/check.sh
  # runs the same paths for the Mac cpu-smoke check.
  cpu-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything but the TP lockstep simulation, one pytest worker per
          # runner core (4); worksteal moves queued tests off a busy worker.
          - name: CPU Core
            id: cpu-tests
            args: >-
              -n 4 --dist worksteal
              --ignore=test/modular/test_tp_async_lockstep_sim.py
              test/modular test/distributed test/chatterbox test/kokoro test/omnivoice test/sampling_test mstar/model/*/tests benchmark/worker_phases
          # Its three simulations take up to 3.5 minutes each on these runners
          # and would set the main shard's wall time, so they run beside it.
          - name: CPU Core (TP lockstep sim)
            id: cpu-tests-tp-sim
            args: -n 3 test/modular/test_tp_async_lockstep_sim.py
    # A new push to a PR cancels its older run. On main each merge commit gets
    # its own group and is never cancelled, so every merge reports a result.
    concurrency:
      group: ${{ matrix.id }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
      - name: Install mstar with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 \
            --index-url https://download.pytorch.org/whl/cpu
          # flex_attention imports torch._inductor, which needs Triton even on
          # CPU; 3.6.0 is the version torch 2.10.0 pins.
          python -m pip install triton==3.6.0
          python -m pip install -e ".[dev,waypoint,metrics]"
          # BAGEL's CPU graph/KV tests import these model modules without
          # loading weights or requiring the CUDA-only BAGEL extras.
          python -m pip install einops regex transformers
          # LingBot-World's request contract tests clean prompts and resample
          # camera poses the way its reference does (no weights needed).
          python -m pip install ftfy scipy
          # Model.load_audio decodes with libsndfile before torchcodec; the
          # tests of that path skip without it.
          python -m pip install soundfile
          # The Wan VAE decode tests build tiny random AutoencoderKLWan models
          # (no weights); 0.39 is the release the decoder was verified on.
          python -m pip install diffusers==0.39.0
          # pytest is pinned with the rest of the test stack, so a release can't
          # change fixture behaviour under every PR at once.
          python -m pip install pytest==9.2.0 pytest-xdist==3.8.0
          # The AudioSeal watermark streaming tests build its generator with
          # random weights (no download).
          python -m pip install "audioseal>=0.2,<0.3"
          python -m pip check
          # The Qwen3-TTS codec tests load qwen-tts' speech-tokenizer modules.
          # Its metadata pins transformers==4.57.3 and packages mstar never
          # imports, so it goes in without them, after pip check.
          python -m pip install --no-deps "qwen-tts==0.1.1"
      - name: Run CPU tests
        env:
          HF_HUB_OFFLINE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          # One thread per worker: workers with 4 OpenMP threads each
          # oversubscribe the 4 cores, and on a busy host the conv-heavy
          # decode tests stall.
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m pytest -q -ra --strict-markers --durations=20 -p xdist \
            --junitxml=${{ matrix.id }}.xml ${{ matrix.args }}
      - name: Upload CPU test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-results
          path: ${{ matrix.id }}.xml
          retention-days: 7
  # Dynamo backend contract: bridge body translations plus a registration
  # smoke against the pinned ai-dynamo wheel (in-memory discovery backend —
  # no GPU, no etcd). Fails here when a wheel bump moves the contract.
  dynamo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mstar with the dynamo extra (cpu torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dynamo]" pytest==9.2.0
      - name: Bridge + registration tests
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest test/modular/test_dynamo_bridges.py test/modular/test_dynamo_registration_smoke.py -v
  # Vendored Rust transport (rust/): cargo tests, then the pyzmq interop
  # pytest against a freshly built extension.
  rust-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - name: Cargo tests (transport + arena semantics)
        working-directory: rust
        # Off with extension-module (see rust/Cargo.toml): the test binary is an
        # executable, so it links libpython rather than resolving CPython
        # symbols at import time. setup-python's interpreter is --enable-shared,
        # so point the loader at its libdir for the run.
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
        run: cargo test --release --no-default-features
      - run: cargo test --release --manifest-path rust/server/Cargo.toml
      - name: Build the Rust frontend (mstar-server)
        working-directory: rust/server
        run: cargo build --release
      - name: Build and install the extension
        working-directory: rust
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release
          pip install target/wheels/*.whl
      - name: Interop tests (transport + arena + frontend)
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
        run: |
          # pyyaml: the runtime tests reach mstar.model.base, which imports it;
          # prometheus-client: the frontend's /metrics test renders a real registry;
          # fastapi, uvicorn, python-multipart and httpx: the Rust/Python chat
          # parity cases run the Python app through fastapi's TestClient
          pip install pytest==9.2.0 pyzmq msgpack numpy pyyaml prometheus-client \
            fastapi uvicorn python-multipart httpx
          # cpu torch + triton: the arena test imports the tensor-transport
          # stack, which reaches mstar.utils.sampling (triton at module level)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton
          # the package itself, without its remaining (heavy) deps
          pip install --no-deps -e .
          # the row store needs the columnar tensor store; CPU Core skips most of it
          pytest test/rust/ test/modular/test_row_output_store.py -v
