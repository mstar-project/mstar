name: Claude Review

# Advisory LLM review of PRs. Not a merge gate. Rules live in AGENTS.md;
# the reviewer's operating instructions are in .github/review/review-prompt.md.
#
# Why issue_comment: a plain `pull_request` trigger withholds secrets from fork
# PRs, so the reviewer could never review a fork's code. issue_comment runs with
# secrets, and always uses the default branch's copy of this workflow file, never
# the PR's version, whatever the PR's base. The comment body is only matched by
# the `if` and the preflight's COMMAND below, never passed to a shell.
#
# The safety rules that come with that, and that must hold for any edit here:
#
#   1. Never check out the PR at the repository root, and never build, install
#      or execute anything from it. The PR's tree goes in pr-head/ and is read
#      only. There is no setup-python, no pip, no cargo, no make.
#   2. persist-credentials: false on both checkouts, so no token is written into
#      a working tree the PR controls.
#   3. Rules are read from main's checkout at the root. The prompt tells the
#      model to ignore any AGENTS.md or prompt found under pr-head/, so a PR
#      cannot rewrite the rules it is judged by.
#   4. The job's token can write only to pull requests, and the review app's
#      token (below) only to pull requests and issues of this repository. The
#      model has no shell and no mutation tools: it posts inline comments
#      through the action's tool (which redacts secrets) and returns the summary
#      as fields, which a workflow step renders, redacts and posts. The worst
#      case for a prompt injection is a bad comment.
#   5. Third-party actions are pinned to a commit SHA, since they run with the
#      API key. Bump them deliberately.

# When it runs, and who can cause it. Only on request; opening or pushing to
# a PR never starts a review.
#   - light, when someone with write access comments `/review light` on a PR,
#     or when a contributor comments `/review light` on their own PR, unless it
#     has the `skip-ai-review` label. "Contributor" is the commenter's
#     author_association: OWNER, MEMBER, COLLABORATOR or CONTRIBUTOR, i.e. the
#     team plus anyone who has had a PR merged here, from a fork or not;
#   - nogpu, when someone with write access comments `/review` or `/review nogpu`.
#     A contributor without write access who comments either on their own PR
#     gets a one-line reply pointing to `/review light`, and nothing runs.
# A run someone with write access starts has a turn cap high enough only to stop
# a loop (CLAUDE_REVIEW_MAX_TURNS_TEAM, 2000); a contributor's own light review
# keeps CLAUDE_REVIEW_MAX_TURNS (40).
# Write access (write, maintain or admin) is checked against the user's actual
# permission in the preflight; author_association can't tell write from read.
# The PR can be from anyone, so a maintainer can /review a first-timer's PR.
#
# The action refuses to run for an actor without write access unless that
# actor is listed in allowed_non_write_users. Most contributors' PRs come from
# forks without write access, so the preflight lists exactly one login there,
# and only when the actor is the PR's author, is a contributor, and the run is
# their own `/review light`. Never '*'. Such a run reads the same untrusted PR
# content as a maintainer's /review of that PR, with the same tools and token;
# only who can start it changes.
#
# Failures never turn the PR's check red: every step after the preflight is
# continue-on-error and gated on the one before it, and if the review didn't
# complete, the last step says so in a PR comment with a link to the log.
#
# Failing gracefully: a review that finished but went past --max-turns (the
# action then reports a failure) still has its summary in the action's
# execution file, and that summary is posted. A review that stopped before it
# finished gets a "didn't complete" comment listing the inline comments it made
# (the action posts them even when the run fails), and a handoff is saved as an
# artifact for 7 days: the inline comments it made, the files it read, its
# latest messages and its progress note if it kept one (session.py). These
# list unverified leads, so they stay out of the PR conversation (the artifact
# can be downloaded, though).
# `/review continue` starts a fresh session from that handoff with a fresh turn
# budget, rather than resuming the old session, which would replay the whole
# transcript, usually after its prompt cache has expired. Only artifacts made
# by this workflow on issue_comment are trusted, since a fork's own
# `pull_request` workflow can upload an artifact with any name.
#
# Every run that reaches Claude records its API calls, tokens, turns and cost
# in the job summary and a review-usage-* artifact, never on the PR.

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  # Credential-shaped strings, removed (sed -E "$REDACT") from everything
  # the workflow posts or saves.
  REDACT: |
    s/sk-ant-[A-Za-z0-9_-]+/[REDACTED]/g
    s/(gh[opsur]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED]/g
    s/hf_[A-Za-z0-9]{20,}/[REDACTED]/g
    s/AKIA[0-9A-Z]{16}/[REDACTED]/g
    s/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+/[REDACTED]/g

jobs:
  # Decides whether a comment starts a review, in which mode and with which
  # turn cap, and replies to a request it turns down. It has no concurrency
  # group, so a refused or unrelated request never cancels a review in progress.
  preflight:
    name: Preflight
    # No repository pin: a fork with no ANTHROPIC_API_KEY exits green at the
    # preflight below, which is the same protection and visible in the log
    # rather than a silently skipped job. It also means a fork that *does* set
    # the key gets reviews, which is how you test changes to this workflow.
    #
    # This only filters cheaply; the preflight's permission check decides.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (((github.event.comment.body == '/review' || github.event.comment.body == '/review nogpu' ||
          github.event.comment.body == '/review light' || github.event.comment.body == '/review continue') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        ((github.event.comment.body == '/review' || github.event.comment.body == '/review nogpu' ||
          github.event.comment.body == '/review light' || github.event.comment.body == '/review continue') &&
         github.event.comment.user.login == github.event.issue.user.login &&
         !contains(github.event.issue.labels.*.name, 'skip-ai-review') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The one-line reply to a refused request.
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
    outputs:
      run: ${{ steps.pre.outputs.run }}
      mode: ${{ steps.pre.outputs.mode }}
      non_write_user: ${{ steps.pre.outputs.non_write_user }}
      turns: ${{ steps.pre.outputs.turns }}
    steps:
      # Secrets can't be tested in a job-level `if`, so short-circuit here
      # instead. Lets this land before ANTHROPIC_API_KEY exists without
      # failing a check on every PR. Then the actor needs write access, or must
      # be the PR's author, a contributor, on `/review light` or `/review
      # continue` (see the header). A contributor's `/review` or `/review nogpu`
      # on their own PR gets a one-line reply (`refuse`); anyone else exits
      # green with a notice.
      # non_write_user is set only for that author, and only when they lack
      # write access, so a maintainer's run is unchanged.
      - name: Preflight
        id: pre
        env:
          KEY_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # The commenter's association; a self-serve run also requires commenter == author.
          ASSOC: ${{ github.event.comment.author_association }}
          SKIP_LABEL: ${{ contains(github.event.issue.labels.*.name, 'skip-ai-review') }}
          TEAM_TURNS: ${{ vars.CLAUDE_REVIEW_MAX_TURNS_TEAM }}
          SELF_TURNS: ${{ vars.CLAUDE_REVIEW_MAX_TURNS }}
          # The command, as one of these fixed words; the comment's text itself never reaches the shell.
          COMMAND: >-
            ${{ (github.event.comment.body == '/review light' && 'light') ||
                ((github.event.comment.body == '/review' || github.event.comment.body == '/review nogpu') && 'nogpu') ||
                (github.event.comment.body == '/review continue' && 'continue') || '' }}
        run: |
          if [ "$KEY_SET" != "true" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; skipping the review."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$COMMAND" in
            light|nogpu) mode=$COMMAND ;;
            continue) mode="" ;;  # the stopped review's mode, from its handoff
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2> /dev/null || echo none)
          case "$perm" in
            admin|maintain|write)
              {
                echo "run=true"
                echo "mode=$mode"
                echo "turns=${TEAM_TURNS:-2000}"
              } >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) contributor=true ;;
            *) contributor=false ;;
          esac
          own=false
          [ "$contributor" = "true" ] && [ -n "$ACTOR" ] && [ "$ACTOR" = "$AUTHOR" ] && [ "$SKIP_LABEL" != "true" ] && own=true
          if [ "$own" = "true" ] && [ "$COMMAND" != "nogpu" ]; then
            echo "::notice::$ACTOR has '$perm' access; reviewing their own PR as its author ($ASSOC)."
            {
              echo "run=true"
              echo "mode=$mode"
              echo "non_write_user=$ACTOR"
              echo "turns=${SELF_TURNS:-40}"
            } >> "$GITHUB_OUTPUT"
          elif [ "$own" = "true" ]; then
            echo "::notice::$ACTOR has '$perm' access, not write; this review needs write access."
            {
              echo "run=false"
              echo "refuse=This review needs write access; on your own PR, comment \`/review light\`."
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$ACTOR has '$perm' access, not write; only people with write access, or a contributor on their own PR with \`/review light\`, can request a review."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # A request the preflight turned down with a reason the commenter can act on.
      - name: Reply to a refused request
        if: steps.pre.outputs.refuse != ''
        continue-on-error: true
        env:
          REFUSE: ${{ steps.pre.outputs.refuse }}
        run: gh pr comment "$PR" --repo "$REPO" --body "$REFUSE" > /dev/null

  review:
    name: Review
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    # Job-level, and only for a request the preflight accepted, so no other
    # comment can cancel a review in progress.
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      # actions: read lists and downloads the saved handoff for /review continue.
      actions: read
      contents: read
      # issues: read lists the open issues, for a latent bug that one already tracks.
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
    steps:
      # The bot posts as the mstar-review GitHub App, with the M* logo, rather
      # than as github-actions. Until the app's client ID and key are set
      # (README), the steps below post with the job's own token instead.
      - name: Mint the review app's token
        if: vars.REVIEW_APP_CLIENT_ID != ''
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          # Reacting to a conversation comment needs issues: write.
          permission-issues: write
          permission-pull-requests: write

      # Tell the commenter their /review was picked up; a comment-triggered run
      # is otherwise invisible from the PR.
      - name: Acknowledge the /review comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null

      # The PR's refs and title (an issue_comment event doesn't carry the PR's
      # head or base). The title is untrusted; it only ever reaches the prompt.
      - name: Resolve the PR
        id: pr
        continue-on-error: true
        env:
          MODE: ${{ needs.preflight.outputs.mode }}
          CONTINUE: ${{ needs.preflight.outputs.mode == '' }}
          # Someone with write access: a timeout that only stops a runaway, like the turn cap.
          TEAM: ${{ needs.preflight.outputs.non_write_user == '' }}
        run: |
          gh api "repos/$REPO/pulls/$PR" > pr.json
          if [ -z "$(jq -r '.head.repo.full_name // empty' pr.json)" ]; then
            echo "::warning::The PR's head repository no longer exists; can't check it out."
            echo "why=its head repository (the fork) no longer exists" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "continue=$CONTINUE"
            echo "head_sha=$(jq -r .head.sha pr.json)"
            echo "head_repo=$(jq -r .head.repo.full_name pr.json)"
            # Mode sets the prompt's reporting bar and the reasoning effort.
            # Without --effort, Claude Code uses its default for Opus (medium).
            # A /review continue takes the mode, effort and timeout of the review it continues.
            case "$MODE" in
              nogpu) echo "mode=nogpu"; echo "effort=xhigh"; timeout=45 ;;
              *) echo "mode=light"; echo "effort=high"; timeout=25 ;;
            esac
            [ "$TEAM" = "true" ] && timeout=300
            echo "timeout=$timeout"
            delim="TITLE_$(openssl rand -hex 8)"
            echo "title<<$delim"; jq -r .title pr.json; echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Trusted: main's tip, pinned by name, never the PR's base branch or
      # base.sha, which for a stacked or old PR would be stale rules.
      # AGENTS.md and the review prompt come from here.
      - name: Check out main
        if: steps.pr.outcome == 'success'
        id: base
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # /review continue: fetch the handoff a stopped review saved (see "Write
      # the handoff" below); it waits in $RUNNER_TEMP until the diff step. The newest
      # unexpired artifact for this PR wins, and only from this workflow on a
      # trigger that runs the base repository's copy of it. The handoff's mode
      # is kept; a nogpu one needs write access to continue, like `/review
      # nogpu`. Values from handoff.json are checked before use. A stopped
      # review can be continued only while its "didn't complete" comment is
      # still open: any later run that finishes rewrites that comment as
      # resolved, so a handoff it superseded is never used.
      - name: Restore the stopped review
        if: steps.base.outcome == 'success' && steps.pr.outputs.continue == 'true'
        id: prev
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          NON_WRITE: ${{ needs.preflight.outputs.non_write_user }}
        run: |
          name="claude-review-handoff-$PR"
          fail() { echo "why=$1" >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 1; }
          open_ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] |
              select((.user.login == "mstar-review[bot]" or .user.login == "github-actions[bot]") and
                (.body | startswith("<!-- claude-review-incomplete -->"))) | .id') \
            || fail "the PR's comments couldn't be read; try \`/review continue\` again"
          [ -n "$open_ids" ] || fail "there is no stopped review of this PR to continue: none stopped part-way, or a later run already finished (handoffs are kept for 7 days); ask for a new review with \`/review light\` or \`/review\`"
          found=""
          for run_id in $(gh api "repos/$REPO/actions/artifacts?name=$name&per_page=30" --jq '
              [.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[].workflow_run.id'); do
            read -r path event < <(gh api "repos/$REPO/actions/runs/$run_id" --jq '"\(.path) \(.event)"') || continue
            case "$path:$event" in
              .github/workflows/claude-review.yml*:issue_comment)
                found=$run_id; break ;;
            esac
          done
          [ -n "$found" ] || fail "there is no stopped review of this PR to continue (handoffs are kept for 7 days); ask for a new review with \`/review light\` or \`/review\`"
          dir="$RUNNER_TEMP/prev"
          gh run download "$found" --repo "$REPO" -n "$name" -D "$dir" \
            || fail "the saved handoff couldn't be downloaded; try \`/review continue\` again"
          meta="$dir/handoff.json"
          mode=$(jq -r '.mode // empty' "$meta" 2> /dev/null) || fail "the saved handoff is malformed"
          # A handoff saved before the modes were renamed carries the old name.
          mode=$(python3 -c 'import runpy, sys; print(runpy.run_path(".github/review/render_summary.py")["current_mode"](sys.argv[1]))' "$mode")
          [ -s "$dir/handoff.md" ] || fail "the saved handoff is malformed"
          [ "$(jq -r '.pr' "$meta")" = "$PR" ] || fail "the saved handoff is for another PR"
          [ "$(jq -r '.head_sha' "$meta")" = "$HEAD_SHA" ] \
            || fail "the PR has new commits since that review stopped; ask for a new review of the current head with \`/review light\` or \`/review\`"
          case "$mode" in
            light) effort=high; timeout=25 ;;
            nogpu)
              [ -z "$NON_WRITE" ] || fail "continuing a nogpu review takes write access, like \`/review nogpu\`"
              effort=xhigh; timeout=45 ;;
            *) fail "the saved handoff is malformed" ;;
          esac
          [ -n "$NON_WRITE" ] || timeout=300
          {
            echo "dir=$dir"
            echo "mode=$mode"; echo "effort=$effort"; echo "timeout=$timeout"
          } >> "$GITHUB_OUTPUT"

      # Untrusted: the PR's tree, for reading changed files in full context.
      # Never executed.
      - name: Check out the PR into pr-head/
        if: steps.base.outcome == 'success' && steps.prev.outcome != 'failure'
        id: head
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr-head
          persist-credentials: false

      # The body and all comments are untrusted; the prompt says so.
      - name: Collect the diff, description and existing comments
        if: steps.head.outcome == 'success'
        id: diff
        continue-on-error: true
        env:
          PREV: ${{ steps.prev.outputs.dir }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MODE: ${{ steps.prev.outputs.mode || steps.pr.outputs.mode }}
        run: |
          if [ -n "$PREV" ]; then cp "$PREV/handoff.md" handoff.md; fi
          # GitHub refuses `gh pr diff` past 20,000 lines or 300 files. Fall back
          # to the files API (up to 3,000 files; it omits the patch of a file
          # that is too large on its own). A removed file's new side is /dev/null,
          # as in git's own diff.
          if ! gh pr diff "$PR" --repo "$REPO" > pr.diff 2> diff.err; then
            echo "::warning::gh pr diff failed ($(head -c 300 diff.err)); building pr.diff from the files API."
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] |
              (.previous_filename // .filename) as $old |
              (if .status == "removed" then "/dev/null" else "b/\(.filename)" end) as $new |
              "diff --git a/\($old) b/\(.filename)\n--- a/\($old)\n+++ \($new)\n\(.patch // "(no patch from GitHub: binary, or too large to show)")"' > pr.diff
          fi
          gh pr view "$PR" --repo "$REPO" --json body --jq .body > pr-body.md

          # Inline review comments, each marked with its thread's resolved and
          # outdated state (only GraphQL has those), and `mine` when this bot posted it.
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | {id, user: .user.login, path, line, side, in_reply_to_id, body}' | jq -s . > review-comments.json
          gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
                reviewThreads(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { isResolved isOutdated comments(first: 1) { nodes { databaseId } } }
                } } } }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] |
              {id: .comments.nodes[0].databaseId, resolved: .isResolved, outdated: .isOutdated}' | jq -s . > threads.json
          bots=$(python3 -c 'import json, runpy; print(json.dumps(runpy.run_path(".github/review/render_summary.py")["BOTS"]))')
          jq --slurpfile t threads.json --argjson bots "$bots" '
            ($t[0] | map({key: (.id | tostring), value: {resolved, outdated}}) | from_entries) as $m
            | map(. + ($m[(.in_reply_to_id // .id) | tostring] // {})
                  + {mine: (.user as $u | any($bots[]; . + "[bot]" == $u))})' review-comments.json > pr-comments.json

          # The conversation tab: replies to the summary, and the author's answers.
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | {id, user: .user.login, created_at, body}' | jq -s . > pr-conversation.json

          # A re-review starts from this bot's last summary, when its commit is still an ancestor
          # of the head: the review re-checks those findings and reads only what changed since
          # (review-prompt.md, "Re-review"). After a force-push it reviews the whole PR again, and
          # a nogpu review does too unless the last one was nogpu and skipped nothing.
          # The state is read only from the bot's own summaries: comments that start with the
          # summary's marker, in which model text can't open an HTML comment.
          if [ -z "$PREV" ]; then
            jq -r '[.[] | select(.user == "mstar-review[bot]" or .user == "github-actions[bot]")
                    | select(.body | startswith("<!-- claude-review-summary -->"))] | last | .body // empty' \
              pr-conversation.json | python3 .github/review/render_summary.py --state --mode "$MODE" > last-review.json
            last=$(jq -r '.head // empty' last-review.json 2> /dev/null)
            # A diff GitHub won't give (too large, say) means a full review, never an empty since.diff.
            if [ -n "$last" ] && [ "$(gh api "repos/$REPO/compare/$last...$HEAD_SHA" --jq .status 2> /dev/null)" = "ahead" -o "$last" = "$HEAD_SHA" ] &&
              gh api -H "Accept: application/vnd.github.diff" "repos/$REPO/compare/$last...$HEAD_SHA" > since.diff; then
              gh api --paginate "repos/$REPO/compare/$last...$HEAD_SHA" --jq '.commits[] |
                "\(.sha[0:10]) \(if (.parents | length) > 1 then "[merge] " else "" end)\(.commit.message | split("\n")[0])"' \
                > since-commits.txt || : > since-commits.txt
              echo "::notice::Re-review: this PR was last reviewed at ${last:0:10}."
              echo "rereview=true" >> "$GITHUB_OUTPUT"
            else
              rm -f last-review.json since.diff
            fi
          fi

          # The PRs stacked above this one, for a finding one of them fixes (fixed_above): every open PR
          # based on this PR's branch, then on theirs, up to 5. above-<n>.diff is the change from this
          # head to PR n's head, and stacked-above.json lists them as [{number, head_sha}]; the summary
          # counts a finding as fixed above only in one of them. Only a branch of this repository can
          # have PRs based on it, so only PRs from this repository count and have their branches walked
          # (a fork's branch name can match a branch here), and a PR counts only when its head descends
          # from this head. Branch names and commits reach a command line only after jq has checked them.
          # A failed fetch leaves none of these files, so a finding said to be fixed above stays open, and
          # the review still runs.
          stacked_above() {
            local branches=() ref list n sha next status
            ref=$(gh api "repos/$REPO/pulls/$PR" --jq 'select(.head.repo.full_name == .base.repo.full_name)
                | .head.ref | select(test("^[A-Za-z0-9._/][A-Za-z0-9._/-]*$"))') || return 1
            [ -z "$ref" ] || branches=("$ref")
            echo '[]' > stacked-above.json
            while [ ${#branches[@]} -gt 0 ] && [ "$(jq length stacked-above.json)" -lt 5 ]; do
              list=$(gh pr list --repo "$REPO" --base "${branches[0]}" --state open \
                --json number,headRefName,headRefOid,isCrossRepository \
                --jq '.[] | select((.isCrossRepository | not) and (.number | type == "number") and (.headRefOid | test("^[0-9a-f]{40}$"))
                  and (.headRefName | test("^[A-Za-z0-9._/][A-Za-z0-9._/-]*$"))) | "\(.number) \(.headRefOid) \(.headRefName)"') \
                || return 1
              branches=("${branches[@]:1}")
              while read -r n sha next; do
                [ -n "$n" ] && [ "$(jq length stacked-above.json)" -lt 5 ] || continue
                status=$(gh api "repos/$REPO/compare/$HEAD_SHA...$sha" --jq .status) || return 1
                [ "$status" = ahead ] || continue
                gh api -H "Accept: application/vnd.github.diff" "repos/$REPO/compare/$HEAD_SHA...$sha" > "above-$n.diff" \
                  || return 1
                jq --argjson n "$n" --arg sha "$sha" '. + [{number: $n, head_sha: $sha}]' stacked-above.json > above.json \
                  && mv above.json stacked-above.json || return 1
                branches+=("$next")
              done <<< "$list"
            done
          }
          stacked_above || rm -f above-*.diff above.json stacked-above.json

          # The open issues, [{number, title}], so a latent bug on main can name the one that tracks it.
          # Titles are user text: the model reads them as untrusted data, and no command line gets them.
          # A failed fetch leaves no file, and the review says it couldn't check.
          gh issue list --repo "$REPO" --state open --limit 1000 --json number,title > open-issues.json \
            || rm -f open-issues.json

          echo "lines=$(wc -l < pr.diff)" >> "$GITHUB_OUTPUT"
          # The summary's fields, from main, for --json-schema. Assigned first so
          # a failure ends the step rather than passing an empty schema.
          schema=$(python3 .github/review/render_summary.py --schema)
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

      - name: Review
        if: steps.diff.outcome == 'success'
        id: review
        # Advisory: an API or action failure (bad key, outage, out of turns,
        # timeout) never turns the PR's check red; the last step reports it.
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.prev.outputs.timeout || steps.pr.outputs.timeout || '25') }}
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The review app's token, or the job's own. Without a token the action
          # tries to mint a Claude GitHub App token over OIDC, which needs
          # `id-token: write` and that app installed, and fails before reviewing.
          # A team run can outlast the app token's hour, so it posts its inline
          # comments with the job's token, which lasts as long as the job.
          github_token: ${{ needs.preflight.outputs.non_write_user == '' && secrets.GITHUB_TOKEN || steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          # Empty for anyone with write access. Otherwise the PR author alone,
          # set by the preflight; the action then also scrubs secrets from any
          # subprocess environment.
          allowed_non_write_users: ${{ needs.preflight.outputs.non_write_user }}
          # Reads stay inside the checkout (main at the root, the PR in pr-head/), so the model
          # can't read the runner's files, and with --permission-mode dontAsk below any call
          # that would otherwise prompt is refused.
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
          prompt: |
            Read .github/review/review-prompt.md from the repository root and follow it
            exactly. It defines your trust boundary, inputs and output format, and points
            you to the method and its bar.

            Mode: ${{ steps.prev.outputs.mode || steps.pr.outputs.mode }}
            PR #${{ env.PR }}: ${{ steps.pr.outputs.title }}
            Head commit (pass as commit_id on every inline comment): ${{ steps.pr.outputs.head_sha }}
            pr.diff is ${{ steps.diff.outputs.lines }} lines.
            Turn cap: ${{ needs.preflight.outputs.turns }}.
            ${{ steps.prev.outputs.dir && 'This run continues a review of this PR that stopped before it finished. handoff.md has what it left; continue from there as the prompt says.' || '' }}
            ${{ steps.diff.outputs.rereview && 'This is a re-review: last-review.json, since.diff and since-commits.txt are present. Follow the prompt''s Re-review section.' || '' }}
          # No shell or edits; web reads only from the sites listed here (GitHub, the
          # vLLM and SGLang docs, Hugging Face, PyTorch, arXiv) and Claude Code's
          # built-in documentation sites, so the review can read how other projects do it. The only write tool is the inline-
          # comment tool, which the action loads only when it is listed here and
          # which redacts secrets. The summary comes back as structured output.
          # The turn cap is the preflight's: CLAUDE_REVIEW_MAX_TURNS (40) for a
          # contributor's own review, CLAUDE_REVIEW_MAX_TURNS_TEAM (2000) when someone
          # with write access asked. The Skill tool is off: it could load a skill from
          # pr-head/; the prompt reads skills by path from the root instead. Subagents
          # (Task/Agent) review slices of a big PR under the same restrictions.
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ steps.prev.outputs.effort || steps.pr.outputs.effort }}
            --max-turns ${{ needs.preflight.outputs.turns }}
            --permission-mode dontAsk
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Task,Agent,WebSearch,WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:docs.vllm.ai),WebFetch(domain:docs.sglang.ai),WebFetch(domain:docs.sglang.io),WebFetch(domain:huggingface.co),WebFetch(domain:pytorch.org),WebFetch(domain:docs.pytorch.org),WebFetch(domain:arxiv.org)"
            --disallowedTools Bash,Edit,Write,MultiEdit,NotebookEdit,Skill
            --json-schema '${{ steps.diff.outputs.schema }}'

      # The app's token lasts an hour and the review can take five: a fresh one
      # for everything posted from here on.
      - name: Mint the review app's token again
        if: always() && vars.REVIEW_APP_CLIENT_ID != ''
        id: post-app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      # The action fails a run that went past --max-turns even when Claude
      # finished and returned its summary, and on a real failure it still
      # writes everything Claude said to its execution file. Read the result
      # from there: post a finished summary anyway, or say why it stopped.
      - name: Read what a failed review left
        if: steps.review.outcome == 'failure'
        id: salvage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.post-app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -s "$f" ]; then
            echo "why=it stopped before Claude Code returned (a timeout or a setup error)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Out of API credit: a one-line answer instead of a "didn't complete"
          # comment, since there's nothing to retry or continue until it's
          # topped up.
          if jq -e 'any(.[]; .type == "assistant" and (.error == "billing_error" or
                ([.message.content[]? | select(.type == "text") | .text] | join("") | startswith("Credit balance is too low"))))' \
              "$f" > /dev/null; then
            echo "::warning::The Anthropic API account is out of credit; skipping the review."
            echo "billing=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" \
              --body "The review didn't run: the API account for the review bot is out of credit." > /dev/null
            exit 0
          fi
          res=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$f")
          turns=$(jq -r '.num_turns // "?"' <<< "$res")
          subtype=$(jq -r '.subtype // empty' <<< "$res")
          output=$(jq -c 'select(.subtype == "success" and (.is_error | not) and (.structured_output | type == "object"))
            | .structured_output' <<< "$res")
          {
            echo "detail=$turns turns"
            if [ -n "$output" ]; then
              delim="OUT_$(openssl rand -hex 8)"
              echo "structured_output<<$delim"; printf '%s\n' "$output"; echo "$delim"
            else
              case "$subtype" in
                error_max_turns) echo "why=it ran out of turns" ;;
                error_during_execution) echo "why=Claude Code stopped on an error" ;;
                success) echo "why=it finished without returning a summary" ;;
                *) echo "why=Claude Code ended without a result" ;;
              esac
            fi
          } >> "$GITHUB_OUTPUT"

      # What the run used, from the execution file or, after a timeout, the
      # session transcript: a table in the job summary, and a small artifact to
      # compare runs by. Never posted on the PR.
      - name: Record usage
        if: always() && steps.diff.outcome == 'success'
        id: usage
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MODE: ${{ steps.prev.outputs.mode || steps.pr.outputs.mode }}
          CONTINUE: ${{ steps.prev.outputs.dir != '' }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          python3 .github/review/session.py usage --pr "$PR" --head "$HEAD_SHA" --mode "$MODE" \
            --continue "$CONTINUE" --outcome "$OUTCOME" --summary "$GITHUB_STEP_SUMMARY" \
            --out "$RUNNER_TEMP/usage/review-usage-$PR-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            "$RUNNER_TEMP/claude-execution-output.json" "$HOME/.claude/projects"

      - name: Upload the usage record
        if: always() && steps.usage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-usage-${{ env.PR }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usage
          retention-days: 30
          if-no-files-found: ignore

      # The summary is model output from untrusted input. It reaches the shell
      # only through an env var, is rendered by main's render_summary.py, and
      # credential-shaped strings are redacted before it's posted. Each run
      # posts its own summary comment, so a re-review doesn't overwrite the last
      # one. A "didn't complete" comment left by an earlier run is then
      # rewritten to point here, and loses its marker so a later failure starts
      # a fresh one.
      # Parsed by the script, not fromJSON(): a template error in `env` would
      # fail the step outright, past continue-on-error.
      - name: Post the summary
        if: steps.review.outcome == 'success' || steps.salvage.outputs.structured_output != ''
        id: post
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.post-app.outputs.token || secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ steps.review.outputs.structured_output || steps.salvage.outputs.structured_output }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MODE: ${{ steps.prev.outputs.mode || steps.pr.outputs.mode }}
          SALVAGED: ${{ steps.review.outcome != 'success' }}
          DETAIL: ${{ steps.salvage.outputs.detail }}
        run: |
          # Read after the review posted its inline comments, so the status line
          # counts them along with earlier ones still open.
          gh api graphql --paginate --slurp -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
                reviewThreads(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { isResolved isOutdated comments(first: 1) { nodes { databaseId author { login } body } } }
                } } } }' > threads-now.json
          printf '%s' "$OUTPUT" | python3 .github/review/render_summary.py --head "$HEAD_SHA" --mode "$MODE" \
            --threads threads-now.json --above stacked-above.json | sed -E "$REDACT" > summary.md
          # A summary the script can't render leaves the file empty.
          grep -q '[^[:space:]]' summary.md || { echo "::warning::The review returned no summary to render."; exit 1; }
          if [ "$SALVAGED" = "true" ]; then
            printf '\n<sub>This review finished but went past the workflow'"'"'s turn limit (%s), so the action reported it as failed.</sub>\n' "$DETAIL" >> summary.md
          fi
          url=$(gh pr comment "$PR" --repo "$REPO" --body-file summary.md)
          echo "id=${url##*-}" >> "$GITHUB_OUTPUT"
          for id in $(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] |
              select((.user.login == "mstar-review[bot]" or .user.login == "github-actions[bot]") and
                (.body | startswith("<!-- claude-review-incomplete -->"))) | .id' 2> /dev/null); do
            printf '<!-- claude-review-incomplete-resolved -->\nAn earlier review run didn'"'"'t complete; a later run finished: %s\n' "$url" > resolved.md
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@resolved.md > /dev/null || true
          done

      # Hide the earlier summaries as outdated, so the PR shows only the latest
      # one and each earlier one stays a click away. Summaries from before the
      # marker start with the heading instead. Only GraphQL says which comments
      # are already hidden.
      - name: Hide earlier summaries
        if: steps.post.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.post-app.outputs.token || secrets.GITHUB_TOKEN }}
          NEW_ID: ${{ steps.post.outputs.id }}
        run: |
          gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
                comments(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { id databaseId isMinimized author { login } body }
                } } } }' > comments.json
          for node in $(jq -r --arg new "$NEW_ID" '.data.repository.pullRequest.comments.nodes[] |
              select((.author.login == "mstar-review" or .author.login == "github-actions") and (.isMinimized | not) and (.databaseId | tostring) != $new and
                ((.body | startswith("<!-- claude-review-summary -->")) or (.body | startswith("### Automated review"))))
              | .id' comments.json); do
            gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
              -f id="$node" > /dev/null
          done

      # The PR's type/* labels, from the review's structured output. Model
      # output, so each is checked against the fixed list before it reaches
      # the API; type/* labels the review no longer returns are removed. Area
      # and size labels come from pr-labels.yml.
      - name: Set the type labels
        if: steps.post.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.post-app.outputs.token || secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ steps.review.outputs.structured_output || steps.salvage.outputs.structured_output }}
        run: |
          types=()
          while IFS= read -r t; do
            case "$t" in
              new-model|bug|perf|feature|refactor|test|docs|ci) types+=("type/$t") ;;
            esac
          done < <(printf '%s' "$OUTPUT" | jq -r '.types // [] | .[] | strings')
          if [ ${#types[@]} -eq 0 ]; then
            echo "::warning::The review returned no valid type; leaving the type labels alone."
            exit 0
          fi
          for old in $(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name | select(startswith("type/"))'); do
            [[ " ${types[*]} " == *" $old "* ]] || gh api -X DELETE "repos/$REPO/issues/$PR/labels/${old//\//%2F}" > /dev/null
          done
          for label in "${types[@]}"; do
            gh api "repos/$REPO/labels/${label//\//%2F}" > /dev/null 2>&1 ||
              gh api -X POST "repos/$REPO/labels" -f name="$label" -f color=fbca04 > /dev/null
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" > /dev/null
          done

      # A review that stopped before it finished: write the handoff a
      # `/review continue` starts from, from the execution file or, after a
      # timeout, the transcript Claude Code writes as it goes. A continued run
      # that stops too merges its handoff onto the one it started from. Also
      # writes partial.md, what the "didn't complete" comment shows. Model
      # notes on the PR's own content; credential-shaped strings are redacted
      # as for the summary. Artifacts are public on a public repo.
      - name: Write the handoff for /review continue
        if: >-
          always() && steps.review.outcome == 'failure' &&
          steps.salvage.outputs.structured_output == '' && steps.salvage.outputs.billing != 'true'
        id: save
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MODE: ${{ steps.prev.outputs.mode || steps.pr.outputs.mode }}
          PREV: ${{ steps.prev.outputs.dir }}
        run: |
          out="$RUNNER_TEMP/handoff"
          prev=()
          [ -z "$PREV" ] || prev=(--previous "$PREV/handoff.json")
          python3 .github/review/session.py handoff --pr "$PR" --head "$HEAD_SHA" --mode "$MODE" \
            --diff pr.diff --out "$out" --comment partial.md "${prev[@]}" \
            "$RUNNER_TEMP/claude-execution-output.json" "$HOME/.claude/projects"
          sed -E -i "$REDACT" "$out/handoff.json" "$out/handoff.md" partial.md
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the handoff
        if: always() && steps.save.outcome == 'success'
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-handoff-${{ env.PR }}
          path: ${{ steps.save.outputs.dir }}
          retention-days: 7
          if-no-files-found: error

      # Anything above failed: say so on the PR rather than leaving silence.
      # A run the preflight skipped never gets here. Repeated failures update
      # one comment, found by its marker, so retries don't stack up comments.
      # A refused /review continue has a marker of its own, so it never writes
      # over a stopped review's comment (its partial results, and that it can
      # still be continued by someone else).
      - name: Report a review that didn't complete
        if: >-
          always() && steps.salvage.outputs.billing != 'true' &&
          (steps.pr.outcome == 'failure' || steps.prev.outcome == 'failure' ||
           steps.base.outcome == 'failure' || steps.head.outcome == 'failure' ||
           steps.diff.outcome == 'failure' || steps.post.outcome == 'failure' ||
           (steps.review.outcome == 'failure' && steps.salvage.outputs.structured_output == ''))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.post-app.outputs.token || secrets.GITHUB_TOKEN }}
          WHY: ${{ steps.prev.outputs.why || steps.salvage.outputs.why || steps.pr.outputs.why || 'a step failed' }}
          DETAIL: ${{ steps.salvage.outputs.detail }}
          CAN_CONTINUE: ${{ steps.upload.outcome == 'success' }}
          REFUSED: ${{ steps.prev.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$REFUSED" = "true" ]; then
            # /review continue that had nothing usable to continue from; WHY says what to do.
            marker='<!-- claude-review-continue-refused -->'
            printf '%s\n`/review continue` didn'"'"'t run: %s. [Log](%s).\n' "$marker" "$WHY" "$RUN_URL" > failed.md
          elif [ "$CAN_CONTINUE" = "true" ]; then
            next='Comment `/review continue` to continue from its notes in a fresh session (kept for 7 days), or the same `/review` command to start over.'
          else
            next='Comment the same `/review` command to retry.'
          fi
          if [ "$REFUSED" != "true" ]; then
            marker='<!-- claude-review-incomplete -->'
            printf '<!-- claude-review-incomplete -->\nThe automated review didn'"'"'t complete: %s%s. [Log](%s). %s\n' \
              "$WHY" "${DETAIL:+ ($DETAIL)}" "$RUN_URL" "$next" > failed.md
          fi
          if [ -s partial.md ]; then
            printf '\nWhat it had so far:\n\n' >> failed.md
            cat partial.md >> failed.md
          fi
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] |
            select((.user.login == \"mstar-review[bot]\" or .user.login == \"github-actions[bot]\") and (.body | startswith(\"$marker\"))) | .id" 2> /dev/null | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@failed.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file failed.md
          fi
