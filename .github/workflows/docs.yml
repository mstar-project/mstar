name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mstar/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Builds the Sphinx site and publishes it to this repo's own gh-pages branch,
# served as a GitHub Pages project page at https://mstar-project.github.io/mstar/.
# Uses the built-in GITHUB_TOKEN — no deploy key or PAT to own, rotate, or expire.
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the API autosummary imports the package, and conf.py
          # deliberately does not mock torch (PEP 604 annotations break under mocks).
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 \
            --index-url https://download.pytorch.org/whl/cpu
          # The engine imports Triton at module scope, and CPU torch wheels don't
          # bring it; 3.6.0 is the version torch 2.10.0 pins, as in ci.yml.
          pip install triton==3.6.0
          pip install -e .
          # The rest of what the documented modules import at module scope; none
          # of it needs a GPU. diffusers is pinned as in ci.yml.
          pip install einops safetensors transformers diffusers==0.39.0
          pip install -r docs/requirements.txt

      - name: Build HTML
        run: |
          set -o pipefail
          sphinx-build -b html docs docs/_build/html 2>&1 | tee sphinx-build.log

      # Sphinx only warns when it cannot import a module, and publishes the
      # reference without it. Install what the module imports in the step above.
      - name: Fail on modules the API reference could not import
        run: |
          if grep -A4 "failed to import" sphinx-build.log; then
            echo "::error::The API reference could not import the modules above."
            exit 1
          fi

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          commit_message: "docs: publish ${{ github.sha }}"
