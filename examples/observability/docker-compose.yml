# Prometheus and Grafana for an M* server running on this host with
# --enable-metrics. See README.md.
#
#   docker compose -f examples/observability/docker-compose.yml up -d
#
# Both UIs listen on localhost only; drop the "127.0.0.1:" prefixes to expose them.
name: mstar-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    # Lets the container reach the host as host.docker.internal on Linux too
    # (Docker Desktop defines it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Read when Grafana creates its database; "admin" is Grafana's default,
      # which it asks to change at the first login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Optional: anyone who can reach port 3000 sees the dashboards read-only
      # without logging in. Off by default.
      # GF_AUTH_ANONYMOUS_ENABLED: "true"
      # GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards/mstar:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
