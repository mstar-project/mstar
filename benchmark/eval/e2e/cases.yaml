        suite: tts
        data: tts
        args: [--voice, tara, --seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50, rtf_mean]}

  qwen3omni_pd_disaggregated:   # encoders, Code2Wav and Thinker prefill on rank 0; decode on 1; Talker on 2
    serve: qwen3_omni
    config: configs/qwen3omni_pd_disaggregated.yaml
    optional: true
