      - id: text
        modality: text (prefill and decode disaggregated)
        client: chat_text
        n: 16
        args: [--max-tokens, "96"]
        check: {kind: text_match, min_match: 0.5}
        perf: {latency: lat_p50_s, throughput: req_per_s, extra: [ttft_p50_s]}
      - id: audio_out
        modality: speech out (prefill and decode disaggregated)
        client: chat_text
        n: 8
        args: [--max-tokens, "64", --audio-out]
        check: {kind: audio_len, pct: 25}
        quality: [mos]
        perf: {latency: lat_p50_s, throughput: req_per_s, extra: [ttft_p50_s]}

  # ---------------- newer models (optional until their PRs are on main) ----------------
  # Each adds an engine path none of the models above covers (#577). Base must serve the model too, so these stay
  # optional (out of `all`, select with `tag:new-model` or by name) until the model's PR is on main; until then
  # compare them with a base that has the model, e.g. `--base 515 --head <a PR stacked on it>`. No entry yet for
  # Fish S2-Pro (#491: its PR #492 is closed) or MiniCPM-o (#382 serves it on /generate only, with no chat adapter).
  cosyvoice3:            # #495: speech codes streamed into a flow-matching decoder at 24 kHz; clone from an upload
    serve: cosyvoice3
    optional: true
    family: TTS
    tags: [new-model, tts, speech-out, clone]
    requires: [soundfile]
    est_min: 8
    cases:
      - id: clone
        modality: tts (voice clone, streamed)
        suite: tts
        data: clone
        args: [--clone, --seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos, speaker_sim]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50, rtf_mean, sim_mean]}

  voxcpm2:               # #496: tokenizer-free latent patches; 48 kHz streamed audio
    serve: voxcpm2
    optional: true
    family: TTS
    tags: [new-model, tts, speech-out, clone]
    requires: [soundfile, soxr]
    est_min: 10
    cases:
      - id: tts
        modality: tts
        suite: tts
        data: tts
        args: [--seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50, rtf_mean]}
      - id: clone
        modality: tts (voice clone)
        suite: tts
        data: clone
        args: [--clone, --seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos, speaker_sim]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50, sim_mean]}
      - id: design
        modality: tts (voice design)
        suite: tts
        data: tts
        args: [--instructions, "A calm, warm female voice speaking at a moderate pace", --seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50]}

  omnilingual_asr_ctc_300m:   # #515: CTC (non-autoregressive) ASR, no decode loop
    serve: omnilingual_asr_ctc_300m
    optional: true
    family: ASR
    tags: [new-model, asr, speech-in, multipart, small]
    est_min: 4
    conc: [1, 16]
    cases:
      - id: upload
        modality: asr (multipart upload)
        suite: asr
        data: asr
        check: {kind: wer, max_increase: 0.5}
        perf: {latency: e2e_s_p50, throughput: req_per_s, extra: [rtfx]}

  lingbot_world_1_3b:    # #455: rolling sink plus window K/V inside a rollout loop; chunked video stream
    serve: lingbot_world_1_3b
    optional: true
    family: World
    tags: [new-model, world, frames, image-in, streaming]
    requires: [ftfy, scipy]
    est_min: 10
    cases:
      - id: world
        modality: image to world, seeded camera path
        client: world
        n: 4
        conc: [1]
        repeats: 2
        warmup: 1
        check: {kind: psnr, min_db: 25}
        perf: {latency: lat_p50_s, throughput: req_per_s, extra: [ttft_p50_s]}

  # ---------------- worker-to-worker transport (optional) ----------------
  # The split and disaggregated configs above move tensors between worker processes. Each runs here over shared
  # memory (`_shm`), Mooncake TCP (`_tcp`, `--tensor-comm-protocol TCP`) and Mooncake RDMA (`_rdma`, skipped on a
  # host without an RDMA device), with the multi-GPU cases plus two that cancel mid-transfer: `cancel` drops a
  # stream after 3 chunks and after 1.5 s; `timeout` runs on a second server whose `--timeout` is shorter than one
  # of its requests (#572's trigger). After every case `health` checks the server: its processes still alive, no
  # mstar /dev/shm entry left behind, no crash or transfer-failure line in its log. A finding head has and base
  # does not fails the row; base crashing reports it broken. Not in `all`: `tag:w2w` selects SHM and TCP (both also
  # carry `transport`, with the Mooncake variants above), `tag:rdma` the RDMA ones. `tag:mooncake` stays the two
  # one-worker entries above, so `--models all,tag:mooncake` does not pull in the 2- and 3-GPU entries.
  qwen3tts_1p7b_split_shm:
    serve: qwen3_tts_1p7b
    config: configs/qwen3tts_1p7b_split.yaml
    optional: true
    gpus: 1
    case_timeout_s: 900
    health: true
    family: TTS
    tags: [w2w, transport, shm, split, tts, speech-out, ar]
    requires: ["mstar.model.qwen3_tts.qwen3_tts_model:_load_qwen3_tts_codec_classes"]
    est_min: 12
    cases: &qwen3tts_split_w2w
      - id: tts
        modality: tts (Talker and codec split)
        suite: tts
        data: tts
        args: [--voice, vivian, --language, English, --seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50, rtf_mean]}
      - id: cancel
        modality: speech stream dropped mid-transfer
        rp: cancel_speech
        args: [--voice, vivian]
        check: {kind: status_match}
      - id: timeout
        modality: speech timed out by the server mid-transfer
        rp: timeout_speech
        server_timeout_s: 5
        args: [--voice, vivian]
        check: {kind: status_match}

  qwen3tts_1p7b_split_tcp:
    serve: qwen3_tts_1p7b
    config: configs/qwen3tts_1p7b_split.yaml
    serve_args: [--tensor-comm-protocol, TCP]
    optional: true
    gpus: 1
    case_timeout_s: 900
    health: true
    family: TTS
    tags: [w2w, transport, split, tts, speech-out, ar]
    requires: ["mstar.model.qwen3_tts.qwen3_tts_model:_load_qwen3_tts_codec_classes", mooncake.engine]
    est_min: 12
    cases: *qwen3tts_split_w2w

  qwen3tts_1p7b_split_rdma:
    serve: qwen3_tts_1p7b
    config: configs/qwen3tts_1p7b_split.yaml
    serve_args: [--tensor-comm-protocol, RDMA]
    optional: true
    gpus: 1
    case_timeout_s: 900
    health: true
    family: TTS
    tags: [rdma, split, tts, speech-out, ar]
    requires: ["mstar.model.qwen3_tts.qwen3_tts_model:_load_qwen3_tts_codec_classes", mooncake.engine, rdma_nic]
    est_min: 12
    cases: *qwen3tts_split_w2w

  orpheus_pd_disaggregated_shm:
    serve: orpheus
    config: configs/orpheus_pd_disaggregated.yaml
    optional: true
    gpus: 2
    case_timeout_s: 900
    health: true
    family: TTS
    tags: [w2w, transport, shm, disaggregated, tts, speech-out, ar]
    est_min: 12
    cases: &orpheus_pd_w2w
      - id: tts
        modality: tts (prefill and decode disaggregated)
        suite: tts
        data: tts
        args: [--voice, tara, --seed, "0"]
        check: {kind: wer, max_increase: 2.0}
        quality: [mos]
        perf: {latency: e2e_s_p50, throughput: audio_s_per_s, extra: [ttfa_ms_p50, rtf_mean]}
      - id: cancel
        modality: speech stream dropped mid-transfer
        rp: cancel_speech
        args: [--voice, tara]
        check: {kind: status_match}
      - id: timeout
        modality: speech timed out by the server mid-transfer
        rp: timeout_speech
        server_timeout_s: 5
        args: [--voice, tara]
        check: {kind: status_match}

  orpheus_pd_disaggregated_tcp:
    serve: orpheus
    config: configs/orpheus_pd_disaggregated.yaml
    serve_args: [--tensor-comm-protocol, TCP]
    optional: true
    gpus: 2
    case_timeout_s: 900
    health: true
    family: TTS
    tags: [w2w, transport, disaggregated, tts, speech-out, ar]
    requires: [mooncake.engine]
    est_min: 12
    cases: *orpheus_pd_w2w

  orpheus_pd_disaggregated_rdma:
    serve: orpheus
    config: configs/orpheus_pd_disaggregated.yaml
    serve_args: [--tensor-comm-protocol, RDMA]
    optional: true
    gpus: 2
    case_timeout_s: 900
