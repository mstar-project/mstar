[package]
name = "mstar-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mstar_rust"
# cdylib: the Python extension module. rlib: the same code as a plain Rust
# library, so other Rust components (servers, services, tools) can consume
# any of this crate's modules directly — typed messaging today, and
# whatever the crate grows to hold — without going through Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
rustc-hash = "2"
thiserror = "2"
zmq = "0.10"
pyo3 = { version = "0.23" }
rmpv = "1.3.1"

[features]
# On for the cdylib: a Python extension resolves the CPython symbols at import
# time and must NOT link libpython. Off for `cargo test`, whose binary is an
# executable and therefore has to link it -- hence
# `cargo test --no-default-features`.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
