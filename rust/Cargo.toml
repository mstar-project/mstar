[package]
name = "mstar-rust"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mstar_rust"
# cdylib: the Python extension module. rlib: the same code as a plain Rust
# library, so other Rust components (servers, services, tools) can consume
# any of this crate's modules directly — typed messaging today, and
# whatever the crate grows to hold — without going through Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
# O_NOFOLLOW and getuid for the shm arena's segment files (std has neither).
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
rustc-hash = "2"
thiserror = "2"
zmq = "0.10"
pyo3 = { version = "0.26", optional = true }
rmpv = "1.3.1"
# Direct msgpack writing. rmpv builds a Value tree first, which allocates a
# String for every map KEY -- ~13 per tensor descriptor -- and then copies the
# whole tree again on serialise. Kept for the handful of Python-encoded values
# that have to be re-nested (see frames.rs).
rmp = "0.8"

[features]
# `python`: the PyO3 bindings and the modules built on them (graph runtime,
# tensor bookkeeping). `extension-module` adds the cdylib's rule that a Python
# extension resolves the CPython symbols at import time and must NOT link
# libpython. `cargo test` builds an executable, which has to link it -- hence
# `cargo test --no-default-features --features python`. rust/server takes
# neither, so it links no Python at all.
default = ["extension-module"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
