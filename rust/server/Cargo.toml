[package]
name = "mstar-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mstar-server"
path = "src/main.rs"

[dependencies]
# The vendored transport/arena library crate (rust/) — rlib target. No default
# features: the server uses only the transport, so it builds without `python`
# and links no libpython.
mstar-rust = { path = "..", package = "mstar-rust", default-features = false }
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
futures = "0.3"
base64 = "0.22"
form_urlencoded = "1"
uuid = { version = "1", features = ["v4"] }
serde_bytes = "0.11"
tower-http = { version = "0.5", features = ["cors"] }
# dlopen of the libsndfile soundfile ships (src/sndfile.rs); already in the tree through tokio.
libc = "0.2"
# Names the limit error of a bounded body read; already in the tree through axum.
http-body-util = "0.1"
# Rewrites MSTAR_ROOT_PATH before routing; already in the tree through axum.
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
url = "2"
# Constant-time API key compare; already in the tree through rustls.
subtle = "2"
# The printable classes for Python's `repr` of a str; already in the tree through tokenizers.
regex = "1"
# Dynamic msgpack for openpi's observations and /generate/ws's binary frames;
# already in the tree through the transport crate.
rmpv = "1.3"
# /v1/realtime's speech detection: Silero VAD through the ONNX Runtime library
# the Python side loads, opened at run time (`load-dynamic`), so both frontends
# score a frame with the same runtime and no binary is downloaded at build time.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }

[dev-dependencies]
# a paused clock for the upload-cleanup test; the same tokio
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
