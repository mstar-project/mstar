[package]
name = "mstar-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mstar-server"
path = "src/main.rs"

[dependencies]
# The vendored transport/arena library crate (rust/) — rlib target. No default
# features: the server uses only the transport, so it builds without `python`
# and links no libpython.
mstar-rust = { path = "..", package = "mstar-rust", default-features = false }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
futures = "0.3"
base64 = "0.22"
form_urlencoded = "1"
uuid = { version = "1", features = ["v4"] }
serde_bytes = "0.11"
tower-http = { version = "0.5", features = ["cors"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
url = "2"
# Constant-time API key compare; already in the tree through rustls.
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
